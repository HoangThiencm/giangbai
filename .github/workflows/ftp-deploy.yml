name: Deploy website to hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload files by FTP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-obfuscator-4.1.1

      - name: Install JS obfuscator
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --no-save javascript-obfuscator@4.1.1

      - name: Obfuscate first-party JavaScript
        run: node tools/build-obfuscate.js --in-place

      - name: Sync files to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            GIAO AN/**
            taovideo/assets/vtts/models/**
            **/*.pdf
            **/*.onnx
            **/*.wasm
            .github/**
            api/config.php
            global_config.json
            **/*.md
            **/*.sql
            **/*.zip
            **/*.bak
            **/*.log
            docs/**
            tests/**
            agent-tools/**
            mcps/**
            .agents/**
            backupcode*/**
            *.backup*.html
            setup.php
            tools/**
            package-lock.json
            package.json
            .deploy-obfuscated/**