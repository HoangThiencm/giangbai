<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="js/security-guard.js"></script>
  <script src="access-control.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rung Chuông Vàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script><script src="vendor/babel.min.js"></script>
  <link rel="stylesheet" href="vendor/katex.min.css"><script src="vendor/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>@keyframes ring { 0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)} }.ring{animation:ring .55s ease-in-out infinite}.candidate{transition:.2s}.eliminated{text-decoration:line-through;filter:grayscale(1);opacity:.42}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-950 via-slate-950 to-yellow-900 text-white"><div id="root">Đang chuẩn bị đấu trường...</div>
<script type="text/babel" data-presets="env,react">
const {useEffect,useMemo,useRef,useState}=React;
const MathText=({text})=>{const ref=useRef(null);useEffect(()=>{if(!ref.current)return;const value=String(text||'');ref.current.innerHTML='';const parts=value.split(/(\$\$[\s\S]+?\$\$|\$[\s\S]+?\$)/g);parts.forEach(part=>{if(/^\$/.test(part)){const display=part.startsWith('$$'),node=document.createElement('span');try{katex.render(part.slice(display?2:1,display?-2:-1),node,{throwOnError:false,displayMode:display})}catch{node.textContent=part}ref.current.append(node)}else ref.current.append(document.createTextNode(part))})},[text]);return <span ref={ref}/>};
const makeCandidates=(participants)=>Array.from({length:40},(_,i)=>{const source=participants?.[i];const name=typeof source==='string'?source:(source?.name||source?.fullName||source?.studentName);return {id:String(i+1).padStart(2,'0'),name:name||`Thí sinh ${String(i+1).padStart(2,'0')}`,alive:true}});
const bellSound=()=>{try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=440;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.45);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.75);o.stop(c.currentTime+.78)}catch{}};
function BellGame(){const [data,setData]=useState(null),[candidates,setCandidates]=useState([]),[index,setIndex]=useState(0),[seconds,setSeconds]=useState(15),[duration,setDuration]=useState(15),[running,setRunning]=useState(false),[answer,setAnswer]=useState(false),[champion,setChampion]=useState(null);useEffect(()=>{const raw=localStorage.getItem('gameData');let parsed={};try{parsed=raw?JSON.parse(raw):{}}catch{};if(parsed.gameType&&parsed.gameType!=='bell'){alert('Dữ liệu không thuộc game Rung Chuông Vàng.');location.href='trochoi.html';return}const qs=(parsed.content?.questions||[]).filter(q=>q.prompt&&Array.isArray(q.choices));if(!qs.length)qs.push({prompt:'Việt Nam có bao nhiêu mùa trong năm?',choices:['2','3','4','5'],answer:2,explanation:'Việt Nam có bốn mùa rõ rệt ở miền Bắc.'});setData({...parsed,questions:qs});setCandidates(makeCandidates(parsed.participants||parsed.content?.participants))},[]);useEffect(()=>{if(!running||seconds<=0){if(running&&seconds<=0){setRunning(false);setAnswer(true);bellSound()}return}const timer=setTimeout(()=>setSeconds(s=>s-1),1000);return()=>clearTimeout(timer)},[running,seconds]);const q=data?.questions[index];const alive=candidates.filter(c=>c.alive);const eliminated=candidates.filter(c=>!c.alive);const toggle=(id)=>setCandidates(list=>list.map(c=>c.id===id?{...c,alive:!c.alive}:c));const rescue=(all)=>setCandidates(list=>{const out=[...list];const down=out.filter(c=>!c.alive);const count=all?down.length:Math.ceil(down.length/2);down.sort(()=>Math.random()-.5).slice(0,count).forEach(c=>c.alive=true);return out});const next=()=>{if(alive.length===1){setChampion(alive[0]);bellSound();if(window.confetti)confetti({particleCount:180,spread:120,origin:{y:.55}});return}if(index>=data.questions.length-1){const top=alive[0];setChampion(top);if(top&&window.confetti)confetti({particleCount:160,spread:110});return}setIndex(i=>i+1);setSeconds(duration);setAnswer(false);setRunning(true)};if(!data)return <div className="p-10 text-center">Đang tải...</div>;if(champion)return <main className="min-h-screen flex items-center justify-center p-6 text-center"><section className="rounded-3xl bg-amber-100 text-amber-950 max-w-xl w-full p-10 shadow-2xl"><i className="fa-solid fa-bell text-8xl text-amber-500 ring block mb-6"></i><h1 className="text-4xl font-black">RUNG CHUÔNG VÀNG!</h1><p className="text-xl mt-4">Quán quân: <strong>{champion.name}</strong> · SBD {champion.id}</p><button className="mt-8 px-6 py-3 rounded-xl bg-amber-500 font-bold text-white" onClick={()=>location.reload()}>Chơi lại</button></section></main>;return <main className="max-w-7xl mx-auto p-4 md:p-7"><header className="flex justify-between gap-3 items-center mb-5"><button onClick={()=>location.href='trochoi.html'} className="px-3 py-2 rounded-lg bg-slate-800"><i className="fa fa-arrow-left mr-2"></i>Thoát</button><div className="text-center"><h1 className="text-2xl md:text-4xl font-black text-amber-300"><i className="fa-solid fa-bell mr-2"></i>RUNG CHUÔNG VÀNG</h1><p className="text-amber-100">Câu {index+1} / {data.questions.length} · Còn lại {alive.length} thí sinh</p></div><select value={duration} onChange={e=>{setDuration(+e.target.value);setSeconds(+e.target.value)}} className="bg-slate-800 rounded-lg p-2"><option value="15">15 giây</option><option value="20">20 giây</option><option value="30">30 giây</option></select></header><div className="grid lg:grid-cols-[1fr_330px] gap-5"><section className="space-y-5"><div className="rounded-3xl bg-slate-900/90 p-5 md:p-7 shadow-xl border border-amber-500/30"><div className="flex justify-between items-center gap-3 mb-4"><span className="font-bold text-amber-300">CÂU HỎI {index+1}</span><span className={`text-2xl font-black px-4 py-2 rounded-full ${seconds<=5?'bg-red-600 animate-pulse':'bg-amber-500 text-slate-950'}`}>⏱ {seconds}s</span></div><div className="h-3 rounded-full bg-slate-700 mb-5 overflow-hidden"><div className="h-full bg-amber-400 transition-all" style={{width:`${seconds/duration*100}%`}}/></div><h2 className="text-xl md:text-2xl font-bold mb-5"><MathText text={q.prompt}/></h2><div className="grid sm:grid-cols-2 gap-3">{q.choices.map((choice,i)=><div key={i} className={`rounded-xl p-4 border ${answer&&i===q.answer?'bg-emerald-700 border-emerald-300':'bg-slate-800 border-slate-600'}`}><b className="text-amber-300 mr-2">{String.fromCharCode(65+i)}.</b><MathText text={choice}/></div>)}</div>{answer&&<p className="mt-4 bg-emerald-950/60 p-3 rounded-xl text-emerald-100"><b>Đáp án đúng:</b> {String.fromCharCode(65+q.answer)}. <MathText text={q.explanation||'Giáo viên chọn thí sinh trả lời sai để loại.'}/></p>}<div className="flex flex-wrap gap-3 mt-6"><button onClick={()=>{setSeconds(duration);setRunning(true);setAnswer(false)}} disabled={running} className="px-5 py-3 rounded-xl bg-amber-500 text-slate-950 font-black disabled:opacity-50">Bắt đầu đếm giờ</button><button onClick={()=>{setRunning(false);setAnswer(true);bellSound()}} className="px-5 py-3 rounded-xl bg-slate-700 font-bold">Hết giờ · hiện đáp án</button>{answer&&<button onClick={next} className="px-5 py-3 rounded-xl bg-emerald-600 font-bold">Câu tiếp / Vinh danh</button>}</div></div><div className="rounded-2xl bg-slate-900/70 p-4"><h3 className="font-bold text-amber-300 mb-3">Sàn đấu · bấm thí sinh trả lời sai để loại / bấm lại để khôi phục</h3><div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 gap-2">{candidates.map(c=><button key={c.id} onClick={()=>toggle(c.id)} className={`candidate rounded-xl p-2 text-xs font-bold ${c.alive?'bg-teal-600 hover:bg-teal-500':'bg-slate-700 eliminated'}`}><span className="block text-amber-200">SBD {c.id}</span>{c.name}</button>)}</div></div></section><aside className="space-y-4"><section className="rounded-2xl bg-amber-100 text-amber-950 p-5"><h3 className="font-black text-xl"><i className="fa-solid fa-life-ring mr-2"></i>Thầy cô cứu trợ</h3><p className="my-3 text-sm">Đưa thí sinh ở khu chờ cứu trợ trở lại sàn đấu.</p><button onClick={()=>rescue(false)} className="w-full mb-2 py-3 rounded-xl bg-amber-500 text-white font-bold">Cứu 50% thí sinh</button><button onClick={()=>rescue(true)} className="w-full py-3 rounded-xl bg-amber-700 text-white font-bold">Cứu tất cả thí sinh</button></section><section className="rounded-2xl bg-slate-900 p-5"><h3 className="font-bold text-slate-200">Chờ cứu trợ ({eliminated.length})</h3><div className="mt-3 flex flex-wrap gap-2">{eliminated.map(c=><span key={c.id} className="text-xs bg-slate-700 rounded px-2 py-1">{c.id} · {c.name}</span>)}{!eliminated.length&&<span className="text-slate-400 text-sm">Chưa có thí sinh bị loại.</span>}</div></section></aside></div></main>};ReactDOM.render(<BellGame/>,document.getElementById('root'));
</script></body></html>
