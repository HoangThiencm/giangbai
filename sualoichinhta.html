<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sửa lỗi chính tả AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>body{background:#f5f7fb}.mark{background:#fee2e2;color:#991b1b;border-bottom:2px solid #ef4444;cursor:pointer}.card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;box-shadow:0 5px 20px #0f172a0a}</style></head>
<body class="min-h-screen text-slate-800"><script src="access-control.js"></script>
<header class="bg-gradient-to-r from-indigo-700 to-violet-600 text-white"><div class="mx-auto max-w-6xl px-5 py-7"><a href="index.html" class="text-sm opacity-85"><i class="fa fa-arrow-left mr-2"></i>Trang chủ</a><h1 class="mt-3 text-3xl font-extrabold"><i class="fa-solid fa-spell-check mr-3"></i>Sửa lỗi chính tả AI</h1><p class="mt-2 text-indigo-100">Soát lỗi tiếng Việt, giữ nguyên văn phong và cấu trúc bản gốc.</p></div></header>
<main class="mx-auto max-w-6xl space-y-5 p-5">
<section class="card p-5"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-bold"><i class="fa-solid fa-key mr-2 text-amber-500"></i>Gemini API Key cá nhân</h2><p id="keyStatus" class="mt-1 text-sm text-slate-500">Đang kiểm tra…</p></div><div class="flex gap-2"><button id="testKeys" class="rounded-lg border px-3 py-2 text-sm font-semibold">Kiểm tra key</button><button id="deleteKeys" class="rounded-lg border border-rose-200 px-3 py-2 text-sm font-semibold text-rose-700">Xóa key</button></div></div><div class="mt-4 flex gap-2"><input id="keyInput" type="password" placeholder="Dán Gemini API Key để thêm" class="min-w-0 flex-1 rounded-lg border p-2.5 text-sm"><button id="addKey" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white">Thêm key</button></div><p id="keyMessage" class="mt-2 text-sm"></p></section>
<section class="card p-5"><div class="flex flex-wrap items-center justify-between gap-3"><h2 class="font-bold"><i class="fa-solid fa-file-pen mr-2 text-indigo-600"></i>Văn bản cần kiểm tra</h2><label class="cursor-pointer text-sm font-semibold text-indigo-700"><i class="fa-solid fa-upload mr-1"></i>Tải .txt hoặc .docx<input id="fileInput" type="file" accept=".txt,.docx,text/plain" class="hidden"></label></div><textarea id="sourceText" class="mt-4 h-64 w-full rounded-xl border border-slate-300 p-4 leading-7 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" placeholder="Nhập hoặc dán văn bản tiếng Việt vào đây…"></textarea><div class="mt-4 flex flex-wrap items-center gap-4 text-sm"><label><input id="optSpelling" type="checkbox" checked> Chính tả &amp; gõ phím</label><label><input id="optContext" type="checkbox" checked> Dùng từ theo ngữ cảnh</label><label><input id="optPunctuation" type="checkbox" checked> Dấu câu &amp; khoảng trắng</label><button id="checkBtn" class="ml-auto rounded-lg bg-indigo-600 px-5 py-2.5 font-bold text-white disabled:opacity-50"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Kiểm tra văn bản</button></div><p id="checkMessage" class="mt-3 text-sm"></p></section>
<section id="resultCard" class="card hidden p-5"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-bold">Kết quả kiểm tra</h2><p id="resultSummary" class="mt-1 text-sm text-slate-500"></p></div><div class="flex gap-2"><button id="applyAll" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-bold text-white">Áp dụng tất cả</button><button id="copyText" class="rounded-lg border px-3 py-2 text-sm font-semibold">Sao chép</button><button id="downloadText" class="rounded-lg border px-3 py-2 text-sm font-semibold">Tải file</button></div></div><div id="preview" class="mt-4 whitespace-pre-wrap rounded-xl bg-slate-50 p-4 leading-7"></div><div class="mt-5 overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-100 text-slate-600"><tr><th class="p-3">Từ gốc</th><th class="p-3">Đề xuất</th><th class="p-3">Giải thích / ngữ cảnh</th><th class="p-3"></th></tr></thead><tbody id="errorsTable"></tbody></table></div></section>
</main><script>
const $=s=>document.querySelector(s); let errors=[];
async function request(url, options={}){const r=await fetch(url,options);const d=await r.json().catch(()=>({error:'Phản hồi máy chủ không hợp lệ.'}));if(!r.ok)throw Error(d.error||'Không thể xử lý yêu cầu.');return d}
function msg(id,text,good=false){const e=$(id);e.textContent=text;e.className='mt-2 text-sm '+(good?'text-emerald-700':'text-rose-700')}
async function loadKeys(){try{const d=await request('api/user_gemini_keys.php');$('#keyStatus').textContent=d.count?`Đã lưu ${d.count} key: ${(d.masked_keys||[]).join(', ')}`:'Chưa có key cá nhân. Thêm key ở ô bên dưới.'}catch(e){$('#keyStatus').textContent=e.message}}
$('#addKey').onclick=async()=>{const key=$('#keyInput').value.trim();if(!key)return msg('#keyMessage','Hãy dán Gemini API Key.');try{await request('api/user_gemini_keys.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',keys:[key]})});$('#keyInput').value='';msg('#keyMessage','Đã thêm key cá nhân.',true);loadKeys()}catch(e){msg('#keyMessage',e.message)}};
$('#testKeys').onclick=async()=>{try{const d=await request('api/user_gemini_keys.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'test'})});msg('#keyMessage',`${d.valid_count||0}/${d.tested||0} key dùng được.`,!!d.ok)}catch(e){msg('#keyMessage',e.message)}};
$('#deleteKeys').onclick=async()=>{if(!confirm('Xóa toàn bộ Gemini API Key cá nhân?'))return;try{await request('api/user_gemini_keys.php',{method:'DELETE'});msg('#keyMessage','Đã xóa key.',true);loadKeys()}catch(e){msg('#keyMessage',e.message)}};
$('#fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(/\.txt$/i.test(f.name))$('#sourceText').value=await f.text();else{const zip=await JSZip.loadAsync(f);const xml=await zip.file('word/document.xml').async('text');const doc=new DOMParser().parseFromString(xml,'text/xml');$('#sourceText').value=[...doc.querySelectorAll('w\\:t,t')].map(n=>n.textContent).join('').replace(/\s{2,}/g,' ')}msg('#checkMessage',`Đã nạp ${f.name}.`,true)}catch{msg('#checkMessage','Không đọc được tệp. Chỉ hỗ trợ .txt hoặc .docx hợp lệ.')}};
function applyOne(i){const e=errors[i];const t=$('#sourceText');const pos=t.value.indexOf(e.original_text);if(pos<0)return msg('#checkMessage','Không tìm thấy cụm từ này trong văn bản.');t.value=t.value.slice(0,pos)+e.suggested_text+t.value.slice(pos+e.original_text.length);errors.splice(i,1);render()}
function escaped(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function splitForCheck(text,max=28000){const chunks=[],paras=text.split(/(\n\s*\n)/);let current='';for(let part of paras){if((current+part).length<=max){current+=part;continue}if(current){chunks.push(current);current=''}while(part.length>max){const cut=Math.max(part.lastIndexOf('\n',max),part.lastIndexOf(' ',max),1);chunks.push(part.slice(0,cut));part=part.slice(cut)}current=part}if(current)chunks.push(current);return chunks}
function render(){const source=$('#sourceText').value;let html=escaped(source);errors.forEach((e,i)=>{const a=escaped(e.original_text);html=html.replace(a,`<mark class="mark" title="${escaped(e.suggested_text)}" data-i="${i}">${a}</mark>`)});$('#preview').innerHTML=html;$('#preview').querySelectorAll('mark').forEach(m=>m.onclick=()=>applyOne(+m.dataset.i));$('#errorsTable').innerHTML=errors.map((e,i)=>`<tr class="border-t"><td class="p-3 text-rose-700">${escaped(e.original_text)}</td><td class="p-3 font-semibold text-emerald-700">${escaped(e.suggested_text)}</td><td class="p-3"><b>${escaped(e.error_type)}</b><br><span class="text-slate-500">${escaped(e.explanation)}${e.context?' — '+escaped(e.context):''}</span></td><td class="p-3"><button class="rounded border px-2 py-1 text-xs font-semibold" data-apply="${i}">Áp dụng</button></td></tr>`).join('');document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>applyOne(+b.dataset.apply));$('#resultSummary').textContent=errors.length?`Tìm thấy ${errors.length} lỗi. Nhấn phần tô đỏ hoặc nút Áp dụng để sửa.`:'Không còn lỗi nào trong danh sách.'}
$('#checkBtn').onclick=async()=>{const text=$('#sourceText').value.trim();if(!text)return msg('#checkMessage','Hãy nhập văn bản cần kiểm tra.');$('#checkBtn').disabled=true;const chunks=splitForCheck(text),found=[];try{for(let i=0;i<chunks.length;i++){msg('#checkMessage',`AI đang kiểm tra phần ${i+1}/${chunks.length}…`,true);const d=await request('api/sualoichinhta_ai.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:chunks[i],options:{spelling:$('#optSpelling').checked,context:$('#optContext').checked,punctuation:$('#optPunctuation').checked}})});found.push(...(d.errors||[]))}errors=found;$('#resultCard').classList.remove('hidden');render();msg('#checkMessage',`Hoàn tất ${chunks.length} phần.`,true)}catch(e){msg('#checkMessage',e.message)}finally{$('#checkBtn').disabled=false}};
$('#applyAll').onclick=()=>{while(errors.length)applyOne(0)};$('#copyText').onclick=async()=>{await navigator.clipboard.writeText($('#sourceText').value);msg('#checkMessage','Đã sao chép văn bản.',true)};$('#downloadText').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#sourceText').value],{type:'text/plain;charset=utf-8'}));a.download='van-ban-da-sua.txt';a.click();URL.revokeObjectURL(a.href)};loadKeys();
</script></body></html>
