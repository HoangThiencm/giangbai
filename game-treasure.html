function River({racers,racing,duration,finish,sound}){let cv=useRef(),raf=useRef(),st=useRef({}),won=useRef(false);useEffect(()=>{st.current={};racers.forEach((r,i)=>st.current[r.id]={p:0,v:.045+Math.random()*.02,b:0,i});won.current=false},[racers]);useEffect(()=>{let last=performance.now(),elapsed=0;function f(now){let c=cv.current;if(!c)return;let box=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!==box.width*d){c.width=box.width*d;c.height=box.height*d}let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);let w=box.width,h=box.height,dt=Math.min(now-last,35);last=now;let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#7dd3fc');g.addColorStop(1,'#0369a1');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#65a30d';x.fillRect(0,0,45,h);x.fillRect(w-45,0,45,h);for(let i=0;i<18;i++){x.strokeStyle='#ffffff30';x.beginPath();let y=(i*48+now/25%48);x.moveTo(45,y);x.quadraticCurveTo(w/2,y-12,w-45,y);x.stroke()}x.fillStyle='#92400e';x.fillRect(62,0,12,h);for(let y=0;y<h;y+=20)for(let xx=w-57;xx<w-41;xx+=8){x.fillStyle=((y/20+xx/8)%2?'#111':'#fff');x.fillRect(xx,y,8,10)}x.fillStyle='#fff';x.font='bold 13px system-ui';x.fillText('XUẤT PHÁT',80,22);x.fillText('ĐÍCH 🏁',w-110,22);if(racing){elapsed+=dt;racers.forEach(r=>{let q=st.current[r.id];if(Math.random()<.012)q.b=.5+Math.random()*.7;if(q.b>0){q.v+=.016;q.b-=dt/1000;if(Math.random()<.03)sound.quack()}q.v+=(.05+Math.random()*.04-q.v)*.04;q.p=Math.min(1,q.p+q.v*dt/1000)});let lead=racers.map(r=>({r,p:st.current[r.id].p})).sort((a,b)=>b.p-a.p)[0];if(!won.current&&(lead.p>=1||elapsed>duration*1000)){won.current=true;sound.win();finish(lead.r)}}racers.forEach((r,i)=>{let q=st.current[r.id]||{p:0,b:0};duck(x,82+q.p*(w-155),60+(i+1)*(h-105)/(racers.length+1),COLORS[i%COLORS.length],r.name,q.b>0,racers.length)});raf.current=requestAnimationFrame(f)}raf.current=requestAnimationFrame(f);return()=>cancelAnimationFrame(raf.current)},[racers,racing,duration,finish,sound]);return <canvas ref={cv}/>}
function Roster({list,save,close}){let [tab,setTab]=useState('manual'),[text,setText]=useState(list.map(x=>x.name).join('\n')),[cls,setCls]=useState([]),[note,setNote]=useState('');useEffect(()=>{if(tab==='db'&&!cls.length)fetch('api/exam.php?route=student-classes',{credentials:'include'}).then(r=>r.json()).then(d=>setCls(d.classes||[])).catch(()=>setNote('Không tải được danh sách lớp.'))},[tab]);let select=async e=>{let cn=e.target.value;if(!cn)return;try{let d=await fetch('api/exam.php?route=class-students&class_name='+encodeURIComponent(cn),{credentials:'include'}).then(r=>r.json()),a=(d.roster||[]).map(s=>s.full_name||s.name).filter(Boolean);setText(a.join('\n'));setTab('manual');setNote('Đã nạp '+a.length+' học sinh lớp '+cn)}catch{setNote('Không tải được học sinh.')}};let excel=async e=>{try{let f=e.target.files[0],b=await f.arrayBuffer(),w=XLSX.read(b),rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,defval:''}),a=rows.slice(1).map(r=>String(r[1]||r[0]||'').trim()).filter(v=>v&&!/^\d+$/.test(v));setText(a.join('\n'));setTab('manual');setNote('Đã đọc '+a.length+' học sinh.')}catch{setNote('Không đọc được Excel.')}};return <div className="fixed inset-0 z-50 shade flex items-center justify-center p-4"><div className="pop bg-white rounded-3xl p-6 max-w-2xl w-full"><button className="float-right text-2xl" onClick={close}>×</button><h2 className="text-2xl font-black text-sky-800">👥 Danh sách học sinh</h2><div className="flex flex-wrap gap-2 my-4"><button className="btn bg-sky-600 text-white" onClick={()=>setTab('manual')}>Nhập danh sách mới</button><button className="btn bg-slate-100" onClick={()=>setTab('excel')}>Import Excel</button><button className="btn bg-slate-100" onClick={()=>setTab('db')}>Đổi lớp học (CSDL)</button></div>{tab==='manual'&&<textarea className="w-full h-52 p-3 border-2 rounded-xl" value={text} onChange={e=>setText(e.target.value)} placeholder="Mỗi dòng một học sinh"/>}{tab==='excel'&&<input className="w-full p-4 border-2 roun
