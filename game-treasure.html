    <style>

  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react">
      const { useState, useEffect, useRef, useMemo, useCallback } = React,
        COLORS = [
          "#ef4444",
          "#f97316",
          "#eab308",
          "#22c55e",
          "#06b6d4",
          "#3b82f6",
          "#8b5cf6",
          "#ec4899",
        ];
      const MathText = ({ text }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (!text || !ref.current) return;
          ref.current.innerHTML = "";
          let processed = String(text).trim();
          processed = processed.replace(
            /\`([^\`]+)\`/g,
            (m, g) => "$" + g + "$",
          );
          processed = processed.replace(
            /\\\[([\s\S]+?)\\\]/g,
            (m, g) => "$$" + g + "$$",
          );
          processed = processed.replace(
            /\\\(([\s\S]+?)\\\)/g,
            (m, g) => "$" + g + "$",
          );
          if (
            !processed.includes("$") &&
            (/\\(frac|sqrt|vec|cdot|times|pm|mp|le|ge|ne|neq|alpha|beta|gamma|pi|theta|Delta|[a-zA-Z]+)/.test(
              processed,
            ) ||
              (/^[a-zA-Z0-9\s\+\-\*\/\=\^\_\(\)\{\}\.,<>\\]+$/.test(
                processed,
              ) &&
                /[\^_\\]/.test(processed)))
          )
            processed = "$" + processed + "$";
          processed
            .split(/(\$\$[\s\S]+?\$\$|\$[\s\S]+?\$)/g)
            .forEach((part) => {
              if (!part) return;
              if (part.startsWith("$$") && part.endsWith("$$")) {
                const span = document.createElement("span");
                try {
                  katex.render(part.slice(2, -2), span, {
                    throwOnError: false,
                    displayMode: true,
                  });
                } catch {
                  span.textContent = part;
                }
                ref.current.appendChild(span);
              } else if (part.startsWith("$") && part.endsWith("$")) {
                const span = document.createElement("span");
                try {
                  katex.render(part.slice(1, -1), span, {
                    throwOnError: false,
                    displayMode: false,
                  });
                } catch {
                  span.textContent = part;
                }
                ref.current.appendChild(span);
              } else ref.current.appendChild(document.createTextNode(part));
            });
        }, [text]);
        return <span ref={ref} />;
      };
      const read = () => {
        try {
          return JSON.parse(localStorage.getItem("gameData") || "{}");
        } catch {
          return {};
        }
      };
      const names = (t) => {
        let s = new Set();
        return t
          .split(/\r?\n/)
          .map((x) => x.trim().replace(/^\d+[.)-]\s*/, ""))
          .filter((x) => x && !s.has(x.toLowerCase()) && s.add(x.toLowerCase()))
          .map((name, i) => ({ id: "p" + Date.now() + i, name }));
      };
      function Sound({ on }) {
        let c =
          window._duckAudio ||
          (window._duckAudio = new (
            window.AudioContext || window.webkitAudioContext
          )());
        const b = (f, d = 0.12, type = "square") => {
          if (!on) return;
          if (c.state === "suspended") c.resume();
          let o = c.createOscillator(),
            g = c.createGain();
          o.frequency.value = f;
          o.type = type;
          g.gain.setValueAtTime(0.055, c.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
          o.connect(g).connect(c.destination);
          o.start();
          o.stop(c.currentTime + d);
        };
        return {
          count: (go) =>
            go ? (b(523), setTimeout(() => b(784, 0.3), 100)) : b(660),
          quack: () => {
            b(180, 0.1, "sawtooth");
            setTimeout(() => b(145, 0.1, "sawtooth"), 100);
          },
          boing: () => b(260, 0.16, "sine"),
          splash: () => b(95, 0.09, "triangle"),
          win: () =>
            [523, 659, 784, 1047].forEach((f, i) =>
              setTimeout(() => b(f, 0.24), i * 120),
            ),
          whistle: () => {
            b(880, 0.08, "square");
            setTimeout(() => b(1320, 0.18, "square"), 90);
          },
        };
      }
      function duck(ctx, x, y, color, name, boost, n, accessory, spin) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(spin || 0);
        let z = Math.min(1, Math.max(0.52, 10 / n));
        ctx.scale(z, z);
        let w = Math.max(82, ctx.measureText(name).width + 18);
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-w / 2, -50, w, 25, 13);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#0f172a";
        ctx.textAlign = "center";
        ctx.font = "bold 13px system-ui";
        ctx.fillText(name, 0, -33);
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.ellipse(0, 0, 25, 18, 0, 0, 7);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(-5, -13, 17, 10, 0, 0, 7);
        ctx.fill();
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.ellipse(25, 2, 12, 7, 0, 0, 7);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(10, -14, 8, 0, 7);
        ctx.fill();
        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(12, -14, 3, 0, 7);
        ctx.fill();
        ctx.font = "20px serif";
        ctx.fillText(accessory || (boost ? "🚀" : "🎀"), -28, -15);
        ctx.restore();
      }
      const OBSTACLES = [
        { id: "bread", kind: "bread", p: 0.34, y: 0.28, icon: "🍞" },
        { id: "whirl", kind: "whirl", p: 0.48, y: 0.62, icon: "🌀" },
        { id: "nitro", kind: "nitro", p: 0.58, y: 0.4, icon: "🚀" },
        { id: "turtle", kind: "turtle", p: 0.3, y: 0.78, icon: "🐢" },
      ];
      function roleOf(id, roles) {
        if (!roles) return "pack";
        if (id === roles.winnerId) return "win";
        if (roles.topIds && roles.topIds.indexOf(id) >= 0) return "top";
        return "pack";
      }
      function River({ racers, racing, duration, roles, finish, sound, onComment }) {
        let cv = useRef(),
          raf = useRef(),
          st = useRef({}),
          won = useRef(false),
          told = useRef("");
        useEffect(() => {
          st.current = {};
          racers.forEach((r, i) => {
            st.current[r.id] = {
              p: 0.02 + (i % 7) * 0.008,
              y: 0.1 + ((i * 0.17) % 0.78),
              seed: (i * 37) % 100 / 100,
              cap: 0.42 + ((i * 13) % 20) / 100,
              topCap: 0.72 + ((i * 5) % 8) / 100,
              spin: 0,
              accessory: ["🕶️", "🎓", "🦩", "🎀", "⭐"][i % 5],
              hit: {},
            };
          });
          won.current = false;
          told.current = "";
        }, [racers]);
        useEffect(() => {
          if (!racing) return;
          won.current = false;
          told.current = "";
          racers.forEach((r, i) => {
            let q = st.current[r.id];
            if (!q) return;
            q.p = 0.03 + (i % 5) * 0.01;
            q.spin = 0;
            q.hit = {};
            q.accessory = ["🕶️", "🎓", "🦩", "🎀", "⭐"][i % 5];
          });
        }, [racing, racers]);
        useEffect(() => {
          let last = performance.now(),
            elapsed = 0;
          const tell = (key, m) => {
            if (told.current === key) return;
            told.current = key;
            onComment && onComment(m);
          };
          function f(now) {
            let c = cv.current;
            if (!c) return;
            let box = c.getBoundingClientRect(),
              d = devicePixelRatio || 1;
            if (c.width !== box.width * d || c.height !== box.height * d) {
              c.width = box.width * d;
              c.height = box.height * d;
            }
            let x = c.getContext("2d");
            x.setTransform(d, 0, 0, d, 0, 0);
            let w = box.width,
              h = box.height,
              dt = Math.min(now - last, 40) / 1000;
            last = now;
            let g = x.createLinearGradient(0, 0, w, h);
            g.addColorStop(0, "#7dd3fc");
            g.addColorStop(1, "#0369a1");
            x.fillStyle = g;
            x.fillRect(0, 0, w, h);
            x.fillStyle = "#65a30d";
            x.fillRect(0, 0, 45, h);
            x.fillRect(w - 45, 0, 45, h);
            for (let i = 0; i < 14; i++) {
              x.strokeStyle = "#ffffff30";
              x.beginPath();
              let yy = i * 48 + ((now / 25) % 48);
              x.moveTo(45, yy);
              x.quadraticCurveTo(w / 2, yy - 12, w - 45, yy);
              x.stroke();
            }
            x.fillStyle = "#92400e";
            x.fillRect(62, 0, 12, h);
            for (let yy = 0; yy < h; yy += 20)
              for (let xx = w - 57; xx < w - 41; xx += 8) {
                x.fillStyle = (yy / 20 + xx / 8) % 2 ? "#111" : "#fff";
                x.fillRect(xx, yy, 8, 10);
              }
            x.font = "26px serif";
            OBSTACLES.forEach((ob) => {
              let ox = 82 + ob.p * (w - 155),
                oy = 40 + ob.y * (h - 80);
              x.fillText(ob.icon, ox - 12, oy);
            });
            x.fillStyle = "#fff";
            x.font = "bold 13px system-ui";
            x.fillText("XUẤT PHÁT", 80, 22);
            x.fillText("ĐÍCH 🏁", w - 110, 22);
            if (racing && racers.length && roles && roles.winnerId) {
              elapsed += dt;
              let t = Math.min(1.05, elapsed / Math.max(1, duration));
              if (t >= 0.3)
                tell(
                  "split",
                  "Xoáy nước giữ 80% đàn ở giữa sông — chỉ vài chú bứt tốc! 🌀",
                );
              if (t >= 0.72)
                tell("ribbon", "Một chú vịt xé dải băng khánh thành! 🏁");
              racers.forEach((r) => {
                let q = st.current[r.id];
                if (!q) return;
                let role = roleOf(r.id, roles),
                  target = q.p;
                if (t < 0.3) {
                  target = (0.16 + q.seed * 0.08) * (t / 0.3);
                } else if (role === "pack") {
                  target = q.cap * Math.min(1, (t - 0.22) / 0.55);
                } else if (role === "top") {
                  let u = (t - 0.3) / 0.7;
                  target = 0.24 + u * (q.topCap - 0.24);
                } else {
                  let u = Math.max(0, (t - 0.3) / 0.7);
                  target = 0.3 + Math.pow(u, 0.65) * 0.78;
                }
                OBSTACLES.forEach((ob) => {
                  if (q.hit[ob.id] || q.p > ob.p || target < ob.p) return;
                  q.hit[ob.id] = true;
                  if (ob.kind === "bread" && role !== "win") {
                    target = Math.min(target, q.p + 0.015);
                    q.accessory = "🍞";
                    tell("bread", "Một chú vịt mải đớp bánh mì nên chậm lại! 🍞");
                  } else if (ob.kind === "whirl" && role !== "win") {
                    q.spin = Math.PI * 2;
                    tell("whirl", "Xoáy nước cuốn một chú vịt quay một vòng! 🌀");
                  } else if (ob.kind === "nitro" && role !== "pack") {
                    q.accessory = "🚀";
                    target += 0.03;
                    tell("nitro", "Nitro phụt lửa — vịt dẫn đầu vọt lên! 🚀");
                  } else if (ob.kind === "turtle" && role === "pack") {
                    target = Math.min(q.cap, target + 0.04);
                    q.accessory = "🐢";
                    tell("turtle", "Rùa thần cõng một chú vịt nước rút giữa sông! 🐢");
                  }
                });
                if (role === "pack") target = Math.min(target, q.cap);
                if (role === "top") target = Math.min(target, 0.84);
                q.p += (target - q.p) * Math.min(1, dt * 3);
                q.y += Math.sin(now / 280 + q.seed * 8) * dt * 0.05;
                q.y = Math.max(0.08, Math.min(0.92, q.y));
                q.spin *= 0.9;
              });
              let win = racers.find((r) => r.id === roles.winnerId),
                wp = (st.current[roles.winnerId] || {}).p || 0;
              if (!won.current && win && (wp >= 1 || elapsed >= duration)) {
                won.current = true;
                if (st.current[roles.winnerId])
                  st.current[roles.winnerId].p = Math.max(wp, 1.02);
                sound.win();
                finish(win);
              }
            }
            let winP = roles && st.current[roles.winnerId]
              ? st.current[roles.winnerId].p
              : 0;
            if (winP > 0.9) {
              x.save();
              x.strokeStyle = "#fde68a";
              x.lineWidth = 4;
              x.beginPath();
              x.moveTo(w - 58, h * 0.15);
              x.lineTo(w - 78, h * 0.5);
              x.lineTo(w - 58, h * 0.85);
              x.stroke();
              x.restore();
            }
            racers.forEach((r, i) => {
              let q = st.current[r.id] || { p: 0, y: 0.5, accessory: "🎀" };
              let px = 82 + Math.min(q.p, 1.02) * (w - 155),
                py = 35 + q.y * (h - 70);
              x.fillStyle = "#dff7ff99";
              x.beginPath();
              x.ellipse(px - 32, py + 16, 17, 5, 0, 0, 7);
              x.fill();
              if (q.accessory === "🚀") {
                x.fillStyle = "#fb923c";
                x.beginPath();
                x.moveTo(px - 36, py);
                x.lineTo(px - 54, py + 6);
                x.lineTo(px - 36, py + 12);
                x.fill();
              }
              duck(
                x,
                px,
                py,
                COLORS[i % COLORS.length],
                r.name,
                roleOf(r.id, roles) === "win" && q.p > 0.55,
                racers.length,
                q.accessory,
                q.spin,
              );
            });
            raf.current = requestAnimationFrame(f);
          }
          raf.current = requestAnimationFrame(f);
          return () => cancelAnimationFrame(raf.current);
        }, [racers, racing, duration, roles, finish, sound, onComment]);
        return <canvas ref={cv} />;
      }
      function Roster({ list, save, close }) {
        let [tab, setTab] = useState("manual"),
          [text, setText] = useState(list.map((x) => x.name).join("\n")),
          [cls, setCls] = useState([]),
          [note, setNote] = useState("");
        useEffect(() => {
          if (tab === "db" && !cls.length)
            fetch("api/exam.php?route=student-classes", {
              credentials: "include",
            })
              .then((r) => r.json())
              .then((d) => setCls(d.classes || []))
              .catch(() => setNote("Không tải được danh sách lớp."));
        }, [tab]);
        let select = async (e) => {
          let cn = e.target.value;
          if (!cn) return;
          try {
            let d = await fetch(
                "api/exam.php?route=class-students&class_name=" +
                  encodeURIComponent(cn),
                { credentials: "include" },
              ).then((r) => r.json()),
              a = (d.roster || [])
                .map((s) => s.full_name || s.name)
                .filter(Boolean);
            setText(a.join("\n"));
            setTab("manual");
            setNote("Đã nạp " + a.length + " học sinh lớp " + cn);
          } catch {
            setNote("Không tải được học sinh.");
          }
        };
        let excel = async (e) => {
          try {
            let f = e.target.files[0],
              b = await f.arrayBuffer(),
              w = XLSX.read(b),
              rows = XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]], {
                header: 1,
                defval: "",
              }),
              a = rows
                .slice(1)
                .map((r) => String(r[1] || r[0] || "").trim())
                .filter((v) => v && !/^\d+$/.test(v));
            setText(a.join("\n"));
            setTab("manual");
            setNote("Đã đọc " + a.length + " học sinh.");
          } catch {
            setNote("Không đọc được Excel.");
          }
        };
        return (
          <div className="fixed inset-0 z-50 shade flex items-center justify-center p-4">
            <div className="pop bg-white rounded-3xl p-6 max-w-2xl w-full">
              <button className="float-right text-2xl" onClick={close}>
                ×
              </button>
              <h2 className="text-2xl font-black text-sky-800">
                👥 Danh sách học sinh
              </h2>
              <div className="flex flex-wrap gap-2 my-4">
                <button
                  className="btn bg-sky-600 text-white"
                  onClick={() => setTab("manual")}
                >
                  Nhập danh sách mới
                </button>
                <button
                  className="btn bg-slate-100"
                  onClick={() => setTab("excel")}
                >
                  Import Excel
                </button>
                <button
                  className="btn bg-slate-100"
                  onClick={() => setTab("db")}
                >
                  Đổi lớp học (CSDL)
                </button>
              </div>
              {tab === "manual" && (
                <textarea
                  className="w-full h-52 p-3 border-2 rounded-xl"
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="Mỗi dòng một học sinh"
                />
              )}
              {tab === "excel" && (
                <input
                  className="w-full p-4 border-2 rounded-xl"
                  type="file"
                  accept=".xlsx,.xls,.csv"
                  onChange={excel}
                />
              )}{" "}
              {tab === "db" && (
                <select
                  className="w-full p-3 border-2 rounded-xl"
                  onChange={select}
                >
                  <option>-- Chọn lớp --</option>
                  {cls.map((c) => (
                    <option key={c}>{c}</option>
                  ))}
                </select>
              )}
              <p className="mt-3 text-sky-700 font-bold">
                {note}{" "}
                {tab === "manual" && names(text).length + " học sinh sẵn sàng."}
              </p>
              <button
                className="btn w-full mt-4 bg-emerald-600 text-white"
                onClick={() => save(names(text))}
              >
                Lưu danh sách
              </button>
            </div>
          </div>
        );
      }
      function answerIndex(question) {
        if (!question || question.answer == null || question.answer === "")
          return -1;
        let a = question.answer;
        if (typeof a === "number" && isFinite(a)) {
          if (a >= 0 && a <= 3) return a;
          if (a >= 1 && a <= 4) return a - 1;
        }
        let s = String(a).trim().toUpperCase();
        if (/^[A-D]$/.test(s)) return s.charCodeAt(0) - 65;
        if (/^[1-4]$/.test(s)) return parseInt(s, 10) - 1;
        return -1;
      }
      function App() {
        let data = useMemo(read, []),
          init = (data.participants || [])
            .filter((x) => x.name)
            .map((x, i) => ({ id: x.id || "p" + i, name: x.name })),
          [racers, setRacers] = useState(init),
          [racing, setRacing] = useState(false),
          [phase, setPhase] = useState("idle"),
          [goText, setGoText] = useState(""),
          [winner, setWinner] = useState(null),
          [helper, setHelper] = useState(null),
          [roles, setRoles] = useState(null),
          [roster, setRoster] = useState(!init.length),
          [on, setOn] = useState(true),
          [dur, setDur] = useState(5),
          [limit, setLimit] = useState(15),
          [dropCalled, setDropCalled] = useState(false),
          [history, setHistory] = useState([]),
          [scores, setScores] = useState({}),
          [showHistory, setShowHistory] = useState(false),
          [qIndex, setQIndex] = useState(0),
          [q, setQ] = useState(null),
          [pick, setPick] = useState(null),
          [shown, setShown] = useState(false),
          [secs, setSecs] = useState(15),
          [comment, setComment] = useState(
            "Bấm Bắt đầu: câu hỏi hiện ngay, vịt bứt tốc trong vài giây.",
          ),
          sound = useMemo(() => Sound({ on }), [on]),
          questions = data.content?.questions || [],
          goTimer = useRef(null);
        useEffect(() => {
          if (phase !== "answer" || shown) return;
          let t = setInterval(() => setSecs((s) => (s > 0 ? s - 1 : 0)), 1000);
          return () => clearInterval(t);
        }, [phase, shown, winner]);
        useEffect(() => () => goTimer.current && clearTimeout(goTimer.current), []);
        let start = useCallback(() => {
            if (!racers.length) return setRoster(true);
            if (phase === "go" || phase === "racing") return;
            let qq = questions.length ? questions[qIndex % questions.length] : null;
            setQ(qq);
            setPick(null);
            setShown(false);
            setHelper(null);
            setWinner(null);
            setSecs(limit);
            let ids = racers.map((r) => r.id),
              win = ids[Math.floor(Math.random() * ids.length)],
              rest = ids.filter((id) => id !== win);
            for (let i = rest.length - 1; i > 0; i--) {
              let j = Math.floor(Math.random() * (i + 1));
              let tmp = rest[i];
              rest[i] = rest[j];
              rest[j] = tmp;
            }
            let extra = Math.min(4, Math.max(2, Math.round(racers.length * 0.1)));
            if (racers.length < 4) extra = Math.max(0, racers.length - 1);
            setRoles({ winnerId: win, topIds: rest.slice(0, extra) });
            setPhase("go");
            setGoText("GO!");
            setComment("Còi nổi — cả lớp đọc câu hỏi trong lúc vịt lao đi!");
            sound.whistle();
            goTimer.current = setTimeout(() => {
              setGoText("");
              setPhase("racing");
              setRacing(true);
            }, 500);
          }, [racers, phase, questions, qIndex, limit, sound]),
          finish = useCallback((r) => {
            setRacing(false);
            setPhase("answer");
            setWinner(r);
            setSecs(limit);
            setComment("Xin mời " + r.name + " trả lời!");
            setHistory((h) => [
              ...h,
              { ...r, at: new Date().toLocaleTimeString("vi-VN") },
            ]);
            window.confetti &&
              confetti({
                particleCount: 160,
                spread: 100,
                origin: { y: 0.45 },
              });
          }, [limit]),
          givePoint = (who) => {
            if (!who) return;
            setScores((s) => ({ ...s, [who.id]: (s[who.id] || 0) + 1 }));
            setHistory((h) =>
              h.map((row, i) =>
                i === h.length - 1 ? { ...row, point: true, helper: who.name } : row,
              ),
            );
          },
          reveal = useCallback(() => {
            if (phase !== "answer" || shown) return;
            setShown(true);
            let ci = answerIndex(q);
            if (pick != null && ci >= 0 && pick === ci) givePoint(helper || winner);
          }, [phase, shown, q, pick, helper, winner]),
          advance = useCallback(
            (remove) => {
              if (phase !== "answer" && phase !== "idle") return;
              if (remove && winner)
                setRacers((a) => a.filter((x) => x.id !== winner.id));
              setWinner(null);
              setHelper(null);
              setPick(null);
              setShown(false);
              setQ(null);
              setRoles(null);
              setPhase("idle");
              setRacing(false);
              setQIndex((i) => i + 1);
              setComment("Sẵn sàng lượt mới. Bấm Cách hoặc Bắt đầu.");
            },
            [phase, winner],
          ),
          rescue = useCallback(() => {
            if (phase !== "answer" || !winner) return;
            let pool = racers.filter(
              (r) => r.id !== winner.id && (!helper || r.id !== helper.id),
            );
            if (!pool.length) return;
            let h = pool[Math.floor(Math.random() * pool.length)];
            setHelper(h);
            setComment("Xin mời " + h.name + " hỗ trợ — vịt cứu trợ! 🦆");
            sound.quack();
          }, [phase, winner, racers, helper, sound]);
        useEffect(() => {
          let onKey = (e) => {
            let tag = (e.target && e.target.tagName) || "";
            if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
            if (e.code === "Space") {
              e.preventDefault();
              if (phase === "idle") start();
              else if (phase === "answer" && shown) advance(dropCalled);
            } else if (phase === "answer" && !shown && /^[1-4]$/.test(e.key)) {
              setPick(parseInt(e.key, 10) - 1);
            } else if (phase === "answer" && !shown && /^[a-dA-D]$/.test(e.key)) {
              setPick(e.key.toUpperCase().charCodeAt(0) - 65);
            } else if (e.key === "Enter" && phase === "answer") {
              e.preventDefault();
              reveal();
            } else if ((e.key === "h" || e.key === "H") && phase === "answer") {
              rescue();
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [phase, shown, start, advance, reveal, rescue, dropCalled]);
        return (
          <main className="max-w-7xl mx-auto p-4">
            <header className="bg-white rounded-3xl shadow-xl p-4 mb-4 flex flex-wrap justify-between gap-3">
              <div>
                <h1 className="text-3xl font-black text-sky-800">
                  🦆 ĐUA VỊT NGẪU NHIÊN
                </h1>
                <p>{racers.length} học sinh đang tham gia</p>
              </div>
              <div className="flex gap-2">
                <button
                  className="btn border-2"
                  onClick={() => setRoster(true)}
                >
                  👥 Danh sách
                </button>
                <button
                  className="btn border-2"
                  onClick={() => setShowHistory(true)}
                >
                  📜 Lịch sử
                </button>
                <button className="btn bg-slate-100" onClick={() => setOn(!on)}>
                  {on ? "🔊" : "🔇"}
                </button>
                <button
                  className="btn bg-slate-600 text-white"
                  onClick={() => (location.href = "trochoi.html")}
                >
                  Thoát
                </button>
              </div>
            </header>
            <section className="bg-white rounded-3xl shadow-xl p-4 mb-3">
              <div className="flex justify-between gap-3 items-start">
                <b className="text-violet-700 text-lg">📝 Câu hỏi</b>
                <b className={"text-2xl " + (phase === "answer" && secs <= 5 ? "text-rose-600" : "text-slate-500")}>
                  {phase === "answer" ? "⏱ " + secs + "s" : "⏱ chờ về đích"}
                </b>
              </div>
              <div className="text-2xl font-bold my-3 leading-relaxed min-h-[3rem]">
                {q ? (
                  <MathText text={q.prompt || q.question} />
                ) : (
                  <span className="text-slate-400 text-lg font-semibold">
                    Câu hỏi hiện ngay khi bấm Bắt đầu
                    {questions.length ? " (" + questions.length + " câu)" : ""}.
                  </span>
                )}
              </div>
              {q && (q.choices || []).length > 0 && (
                <div className="grid sm:grid-cols-2 gap-2">
                  {(q.choices || []).map((choice, i) => {
                    let ci = answerIndex(q),
                      on = pick === i,
                      ok = shown && ci === i,
                      bad = shown && on && ci !== i;
                    return (
                      <button
                        key={i}
                        disabled={phase !== "answer" || shown}
                        onClick={() => setPick(i)}
                        className={
                          "text-left p-3 border-2 rounded-xl " +
                          (ok
                            ? "border-emerald-500 bg-emerald-50"
                            : bad
                              ? "border-rose-400 bg-rose-50"
                              : on
                                ? "border-violet-500 bg-violet-50"
                                : "border-slate-200")
                        }
                      >
                        <span className="font-black text-violet-700 mr-2">
                          {String.fromCharCode(65 + i)}.
                        </span>
                        <MathText text={choice} />
                      </button>
                    );
                  })}
                </div>
              )}
              {shown && q && q.explanation && (
                <p className="mt-3 text-slate-600">
                  <MathText text={q.explanation} />
                </p>
              )}
            </section>
            <section className="relative bg-white rounded-3xl shadow-xl p-3">
              <River
                racers={racers}
                racing={racing}
                duration={dur}
                roles={roles}
                finish={finish}
                sound={sound}
                onComment={setComment}
              />
              {goText && (
                <b
                  className="absolute inset-0 flex items-center justify-center text-7xl text-white pointer-events-none"
                  style={{ textShadow: "0 4px 15px #075985" }}
                >
                  {goText}
                </b>
              )}
              {winner && phase === "answer" && (
                <div className="absolute left-1/2 top-4 -translate-x-1/2 bg-amber-50 border-2 border-amber-300 rounded-2xl px-5 py-2 text-center shadow-lg max-w-[90%]">
                  <div className="text-xs font-bold text-amber-700">XIN MỜI TRẢ LỜI</div>
                  <div className="text-2xl font-black text-amber-800">
                    🦆 {helper ? helper.name : winner.name}
                  </div>
                  {helper && (
                    <div className="text-xs text-slate-500">hỗ trợ {winner.name}</div>
                  )}
                </div>
              )}
            </section>
            <div className="mt-3 rounded-2xl bg-slate-900 px-5 py-3 text-center font-bold text-white shadow-lg">
              🎙️ {comment}
            </div>
            <div className="flex flex-wrap justify-center gap-3 mt-4">
              <select
                className="btn border-2"
                value={dur}
                onChange={(e) => setDur(+e.target.value)}
                disabled={phase === "go" || phase === "racing"}
              >
                <option value="3">3 giây · Siêu tốc</option>
                <option value="5">5 giây · Tiêu chuẩn</option>
              </select>
              <select
                className="btn border-2"
                value={limit}
                onChange={(e) => setLimit(+e.target.value)}
                disabled={phase !== "idle"}
              >
                <option value="15">15 giây trả lời</option>
                <option value="30">30 giây trả lời</option>
              </select>
              <label className="btn border-2 flex items-center gap-2">
                <input
                  type="checkbox"
                  checked={dropCalled}
                  onChange={(e) => setDropCalled(e.target.checked)}
                />
                Loại bạn vừa gọi
              </label>
              {phase !== "answer" ? (
                <button
                  disabled={phase === "go" || phase === "racing"}
                  onClick={start}
                  className="btn px-8 py-4 text-lg text-white bg-gradient-to-r from-orange-500 to-rose-600"
                >
                  🏁 BẮT ĐẦU ĐUA
                </button>
              ) : (
                <>
                  <button
                    className="btn bg-slate-800 text-white"
                    onClick={reveal}
                    disabled={shown}
                  >
                    Enter · Mở đáp án
                  </button>
                  <button
                    className="btn bg-emerald-600 text-white"
                    onClick={() => {
                      givePoint(helper || winner);
                      setShown(true);
                      advance(dropCalled);
                    }}
                  >
                    Đúng (+Điểm)
                  </button>
                  <button
                    className="btn bg-sky-600 text-white"
                    onClick={() => advance(dropCalled)}
                  >
                    Tiếp tục
                  </button>
                  <button className="btn bg-amber-500 text-white" onClick={rescue}>
                    🦆 Vịt cứu trợ (H)
                  </button>
                </>
              )}
            </div>
            {roster && (
              <Roster
                list={racers}
                close={() => setRoster(false)}
                save={(a) => {
                  setRacers(a);
                  setRoster(false);
                }}
              />
            )}
            {showHistory && (
              <div className="fixed inset-0 z-50 shade flex items-center justify-center p-4">
                <div className="pop bg-white rounded-3xl p-6 max-w-md w-full">
                  <button
                    className="float-right text-2xl"
                    onClick={() => setShowHistory(false)}
                  >
                    ×
                  </button>
                  <h2 className="text-xl font-black">📜 Lịch sử gọi tên</h2>
                  <ol className="mt-4 space-y-2">
                    {history.length ? (
                      history.map((h, i) => (
                        <li key={i} className="p-2 rounded bg-sky-50">
                          {i + 1}. <b>{h.name}</b> <small>{h.at}</small>
                          {h.point ? " · +1 điểm" : ""}
                          {h.helper && h.helper !== h.name ? " · cứu trợ " + h.helper : ""}
                        </li>
                      ))
                    ) : (
                      <li>Chưa gọi học sinh nào.</li>
                    )}
                  </ol>
                </div>
              </div>
            )}
          </main>
        );
      }
      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
