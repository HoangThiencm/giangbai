<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xuất Kế hoạch Bài dạy Tích hợp NLS & AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, Arial, sans-serif; background:#f8fafc; }
    .paper { background:#fff; width:210mm; min-height:297mm; margin:auto; padding:15mm 15mm 15mm 20mm; box-shadow:0 8px 28px #0f172a22; font-family:"Times New Roman",serif; font-size:13pt; line-height:1.15; text-align:justify; }
    .paper h1 { font-size:14pt; font-weight:bold; text-align:center; text-transform:uppercase; margin:6pt 0; }
    .paper h2 { font-size:14pt; font-weight:bold; margin:10pt 0 5pt; }
    .paper h3 { font-size:13pt; font-weight:bold; margin:8pt 0 4pt; }
    .paper p { margin:3pt 0 6pt; } .paper table{width:100%;border-collapse:collapse;margin:6pt 0}.paper th,.paper td{border:1px solid #111;padding:5px;vertical-align:top}.paper th{background:#f3f4f6;font-weight:bold}.paper ul{margin:3pt 0 6pt;padding-left:22pt}.nls{color:#16a34a;font-weight:bold}.ai{color:#9333ea;font-weight:bold}
    @media print { body{background:#fff}.no-print{display:none!important}.paper{box-shadow:none;margin:0;width:auto;min-height:0} }
  </style>
</head>
<body class="text-slate-800">
  <main class="max-w-7xl mx-auto p-4 md:p-8">
    <header class="no-print rounded-2xl bg-gradient-to-r from-emerald-700 to-teal-700 text-white p-6 shadow-lg mb-6">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between"><div><h1 class="text-2xl font-extrabold">Hệ thống Xuất Kế hoạch Bài dạy Tích hợp NLS &amp; AI</h1><p class="mt-1 text-emerald-50">Chuyển Markdown từ Gemini thành tài liệu Word có công thức OMML chỉnh sửa được.</p></div><span class="w-fit rounded-full bg-white/20 px-3 py-1 text-sm font-semibold"><i class="fa-solid fa-unlock mr-1"></i>Công khai · Không cần tài khoản</span></div>
    </header>
    <section class="no-print rounded-2xl bg-white p-4 shadow-sm border border-slate-200 mb-5 flex flex-wrap gap-3">
      <button id="copyPrompt" class="rounded-xl bg-violet-600 px-4 py-2.5 text-white font-bold hover:bg-violet-700"><i class="fa-regular fa-copy mr-2"></i>Sao chép Prompt cho Gemini</button>
      <button id="loadSample" class="rounded-xl bg-emerald-600 px-4 py-2.5 text-white font-bold hover:bg-emerald-700"><i class="fa-solid fa-flask mr-2"></i>Nạp giáo án mẫu</button>
      <button id="clearAll" class="rounded-xl bg-slate-100 px-4 py-2.5 font-bold hover:bg-slate-200"><i class="fa-solid fa-eraser mr-2"></i>Xóa trắng</button>
      <span id="notice" class="self-center text-sm font-medium text-slate-500" role="status"></span>
    </section>
    <section class="no-print grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="rounded-2xl bg-white p-5 shadow-sm border border-slate-200">
        <h2 class="font-extrabold text-lg mb-4"><i class="fa-solid fa-pen-to-square text-emerald-600 mr-2"></i>Thông tin bài dạy</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="text-sm font-semibold">Môn học<input id="subject" class="mt-1 w-full rounded-lg border-slate-300" value="Toán lớp 8"></label>
          <label class="text-sm font-semibold">Tên bài dạy<input id="title" class="mt-1 w-full rounded-lg border-slate-300" value="Hình chóp tam giác đều"></label>
          <label class="text-sm font-semibold">Thời lượng (tiết)<input id="duration" type="number" min="1" class="mt-1 w-full rounded-lg border-slate-300" value="2"></label>
          <label class="text-sm font-semibold">Giáo viên / Đơn vị<input id="teacher" class="mt-1 w-full rounded-lg border-slate-300" placeholder="Nguyễn Văn A – Trường THCS..."></label>
        </div>
        <label class="block text-sm font-semibold mt-4">Giáo án Markdown từ Gemini<textarea id="markdown" class="mt-1 w-full min-h-[470px] rounded-xl border-slate-300 font-mono text-sm" placeholder="Dán toàn văn giáo án Markdown vào đây…"></textarea></label>
      </div>
      <div class="rounded-2xl bg-white p-5 shadow-sm border border-slate-200 flex flex-col">
        <div class="flex items-center justify-between gap-3 mb-4"><h2 class="font-extrabold text-lg"><i class="fa-regular fa-file-lines text-violet-600 mr-2"></i>Xem trước trang in A4</h2><button id="exportWord" class="rounded-xl bg-blue-700 px-4 py-2.5 text-white font-bold hover:bg-blue-800"><i class="fa-solid fa-file-word mr-2"></i>Xuất Word (.doc / OMML)</button></div>
        <div class="overflow-auto bg-slate-100 rounded-xl p-3 flex-1"><article id="preview" class="paper"><p class="text-slate-400" style="text-align:center">Nạp mẫu hoặc dán Markdown để xem trước.</p></article></div>
      </div>
    </section>
  </main>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const fields = ['subject','title','duration','teacher','markdown'].map($);
    const promptText = `Bạn là chuyên gia sư phạm Việt Nam. Dựa trên giáo án/SGK tôi cung cấp, hãy soạn KẾ HOẠCH BÀI DẠY theo Công văn 5512. Giữ cấu trúc rõ ràng; tích hợp đúng mã Năng lực số theo CV 3456 và năng lực AI theo QĐ 2422 phù hợp với từng hoạt động, không gán khiên cưỡng. Xuất duy nhất Markdown: dùng #/##/###, danh sách -, +, ., bảng Markdown cho tiến trình và bảng tổng hợp cuối bài. Công thức Toán phải ghi LaTeX: inline $...$ và khối $$...$$. Không tạo file, không xuất mã nhị phân.`;
    const sample = { subject:'Toán lớp 8', title:'Hình chóp tam giác đều', duration:'2', teacher:'Nguyễn Văn A – Trường THCS', markdown:`# KẾ HOẠCH BÀI DẠY\n## Bài: HÌNH CHÓP TAM GIÁC ĐỀU\n**Môn học:** Toán 8  \n**Thời lượng:** 2 tiết\n\n## I. Mục tiêu\n- Nhận biết được hình chóp tam giác đều; tính được diện tích xung quanh và thể tích. [TC1.NLa]\n- Sử dụng công cụ số để mô phỏng hình không gian và kiểm chứng kết quả. [8.AI.1]\n\n## II. Thiết bị dạy học và học liệu\n+ Mô hình hình chóp tam giác đều, phiếu học tập, máy tính hoặc phần mềm hình học động.\n+ Học sinh chuẩn bị thước thẳng, giấy nháp.\n\n## III. Tiến trình dạy học\n### 1. Hoạt động khởi động\n- Giáo viên cho học sinh quan sát mô hình mái nhà có dạng hình chóp. [TC2.NLb]\n- Học sinh dự đoán các mặt bên và đáy của hình.\n\n### 2. Hoạt động hình thành kiến thức\nVới cạnh đáy $a$, trung đoạn $l$ và chiều cao $h$, diện tích xung quanh là $S_{xq}=\\frac{3al}{2}$.\n\n$$V=\\frac{1}{3}S_{đáy}h=\\frac{a^2\\sqrt{3}h}{12}$$\n\n| Hoạt động | Sản phẩm | Mã tích hợp |\n| --- | --- | --- |\n| Khám phá mô hình | Phiếu nhận diện các yếu tố | [TC1.NLa] |\n| Dùng phần mềm dựng hình | Tệp mô phỏng và nhận xét | [8.AI.1] |\n\n### 3. Hoạt động luyện tập\n. Tính $S_{xq}$ khi $a=6\\,cm$, $l=5\\,cm$.\n. Thảo luận cách kiểm tra kết quả bằng mô hình số. [AI.2]\n\n## IV. Bảng tổng hợp tích hợp\n| Nội dung | NLS | AI | Minh chứng |\n| --- | --- | --- | --- |\n| Khám phá hình chóp | [TC1.NLa] | [8.AI.1] | Phiếu học tập, tệp mô phỏng |\n| Luyện tập | [TC2.NLb] | [AI.2] | Bài làm của học sinh |` };
    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const katexMath = (latex, display, word) => {
      try { const raw = katex.renderToString(latex, {throwOnError:false, output:'mathml', displayMode:display}); const match = raw.match(/<math[\s\S]*?<\/math>/); if (!match) return esc(latex); let math = match[0].replace('<math ', '<math xmlns="http://www.w3.org/1998/Math/MathML" '); if (!word) return raw; return display ? '<m:oMathPara><m:oMath>'+math+'</m:oMath></m:oMathPara>' : '<m:oMath>'+math+'</m:oMath>'; } catch (_) { return esc(latex); }
    };
    const colourCodes = html => html.replace(/(\[(?:[^\]]*(?:TC\d+\.NL|NLS)[^\]]*)\]|\b(?:NLS|TC\d+\.NL)[A-Za-z0-9._-]*)/g,'<span class="nls">$1</span>').replace(/(\[(?:[^\]]*(?:\d+\.AI|AI)[^\]]*)\]|\b(?:AI|\d+\.AI)[A-Za-z0-9._-]*)/g,'<span class="ai">$1</span>');
    const rich = (text, word=false) => {
      let out='', pos=0, re=/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g, m;
      const normal = value => colourCodes(esc(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>'));
      while ((m=re.exec(text))) { out += normal(text.slice(pos,m.index)); out += katexMath(m[1] || m[2],!!m[1],word); pos=re.lastIndex; }
      return out + normal(text.slice(pos));
    };
    const cells = line => line.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const isSeparator = row => row.every(c => /^:?-{3,}:?$/.test(c.replace(/\s/g,'')));
    function markdownToHtml(markdown, word=false) {
      const lines=String(markdown||'').replace(/\r/g,'').split('\n'); let html='', i=0, list='';
      const endList=()=>{if(list){html+='</ul>';list='';}};
      while(i<lines.length){const line=lines[i];
        if(/^\s*\|/.test(line) && i+1<lines.length && isSeparator(cells(lines[i+1]))){ endList(); const header=cells(line); i+=2; let rows=''; while(i<lines.length && /^\s*\|/.test(lines[i])){rows+='<tr>'+cells(lines[i++]).map(c=>'<td>'+rich(c,word)+'</td>').join('')+'</tr>';} html+='<table><thead><tr>'+header.map(c=>'<th>'+rich(c,word)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'; continue; }
        let h=line.match(/^(#{1,3})\s+(.+)$/); if(h){endList(); const n=h[1].length; html+=`<h${n}>${rich(h[2],word)}</h${n}>`;i++;continue;}
        let li=line.match(/^\s*([-+.] )\s*(.*)$/); if(li){const type=li[1][0]; if(list!==type){endList();list=type;html+='<ul style="list-style-type:'+(type==='-'?'disc':type==='+'?'circle':'square')+'">';}html+='<li>'+rich(li[2],word)+'</li>';i++;continue;}
        if(!line.trim()){endList();i++;continue;} endList();html+='<p>'+rich(line,word)+'</p>';i++;
      } endList();return html;
    }
    function updatePreview(){ $('preview').innerHTML=markdownToHtml($('markdown').value,false) || '<p class="text-slate-400" style="text-align:center">Nạp mẫu hoặc dán Markdown để xem trước.</p>'; }
    function safeFileName(value){return String(value||'Ke_hoach_bai_day').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'')||'Ke_hoach_bai_day';}
    function exportWordDocument(){ if(!$('markdown').value.trim()){show('Hãy dán nội dung giáo án trước khi xuất.',true);return;} const name=esc(String($('title').value||'Kế hoạch bài dạy').toUpperCase()); const meta=`<p style="text-align:center;font-weight:bold;font-size:14pt;margin:0">KẾ HOẠCH BÀI DẠY</p><p style="text-align:center;font-weight:bold;font-size:14pt;margin:3pt 0 8pt">${name}</p><p><b>Môn học:</b> ${esc($('subject').value)} &nbsp;&nbsp; <b>Thời lượng:</b> ${esc($('duration').value)} tiết</p>${$('teacher').value?'<p><b>Giáo viên / Đơn vị:</b> '+esc($('teacher').value)+'</p>':''}`; const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>@page{size:A4;margin:1.5cm 1.5cm 1.5cm 2cm;}body{font-family:'Times New Roman',serif;font-size:13pt;line-height:1.15;text-align:justify;}h1,h2{font-size:14pt;font-weight:bold}h3{font-size:13pt;font-weight:bold}p{margin:3pt 0 6pt}table{width:100%;border-collapse:collapse;margin:6pt 0}th,td{border:1px solid #000;padding:5px;vertical-align:top}th{background:#f3f4f6}.nls{color:#16a34a;font-weight:bold}.ai{color:#9333ea;font-weight:bold}ul{margin:3pt 0 6pt}</style></head><body>${meta}${markdownToHtml($('markdown').value,true)}</body></html>`; saveAs(new Blob(['\ufeff',doc],{type:'application/msword;charset=utf-8'}),safeFileName($('title').value)+'_Tich_hop_NLS_AI.doc');show('Đã tạo file Word .doc có công thức OMML.'); }
    function show(msg,error=false){const n=$('notice');n.textContent=msg;n.className='self-center text-sm font-medium '+(error?'text-rose-600':'text-emerald-700');setTimeout(()=>{if(n.textContent===msg)n.textContent='';},4200);}
    $('copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(promptText);show('Đã sao chép Prompt cho Gemini.');}catch(_){const t=document.createElement('textarea');t.value=promptText;document.body.append(t);t.select();document.execCommand('copy');t.remove();show('Đã sao chép Prompt cho Gemini.');}};
    $('loadSample').onclick=()=>{Object.entries(sample).forEach(([key,val])=>$(key).value=val);updatePreview();show('Đã nạp giáo án mẫu.');};
    $('clearAll').onclick=()=>{fields.forEach(f=>f.value='');updatePreview();show('Đã xóa nội dung.');};
    $('exportWord').onclick=exportWordDocument; fields.forEach(f=>f.addEventListener('input',updatePreview));
    window.convertLatexToOMML=(latex,isDisplay)=>katexMath(latex,isDisplay,true); window.parseMarkdownToWordHtml=markdown=>markdownToHtml(markdown,true); window.exportWordDocument=exportWordDocument;
    updatePreview();
  })();
  </script>
</body>
</html>
