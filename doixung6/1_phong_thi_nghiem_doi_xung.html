<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phòng Thí Nghiệm Ảo: Tính Đối Xứng Hình Phẳng - Toán 6 (SGK KNTT)</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; background: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 11px 20px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  header h1 { margin: 0; font-size: 1.14rem; }
  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    border: none; padding: 9px 15px; border-radius: 10px; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.18); color: white; font-size: 0.88rem;
  }
  .tab-btn.active { background: white; color: #1e3a8a; }

  main { flex: 1; max-width: 1150px; width: 100%; margin: 14px auto; padding: 0 14px; display: grid; grid-template-columns: 274px 1fr; gap: 14px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  .panel, .stage-card {
    background: white; border-radius: 14px; padding: 15px; border: 1px solid #cbd5e1;
    box-shadow: 0 2px 8px rgba(15,23,42,0.05); display: flex; flex-direction: column; gap: 11px;
  }
  .label { font-size: 0.76rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
  .shape-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .chip {
    border: 1.5px solid #cbd5e1; background: white; border-radius: 9px; padding: 7px 7px;
    font-size: 0.81rem; font-weight: 600; cursor: pointer; text-align: left; color: #0f172a;
  }
  .chip.active { border-color: #2563eb; background: #dbeafe; color: #1e3a8a; }

  .tip {
    background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 11px;
    font-size: 0.82rem; color: #1e3a8a; line-height: 1.46; margin-top: auto;
  }

  .canvas-wrap {
    background: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px), linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
    background-size: 28px 28px;
  }
  canvas { max-width: 100%; height: auto; display: block; touch-action: none; }

  .controls {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 11px 14px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row label { font-weight: 700; min-width: 145px; font-size: 0.88rem; }
  input[type="range"] { flex: 1; accent-color: #2563eb; height: 8px; cursor: pointer; }
  .deg { font-weight: 800; color: #1d4ed8; min-width: 48px; text-align: right; font-size: 1.02rem; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: none; border-radius: 9px; padding: 8px 14px; font-weight: 700; cursor: pointer; font-size: 0.86rem; }
  .btn-primary { background: #2563eb; color: white; }
  .btn-muted { background: #e2e8f0; color: #1e293b; }

  .result {
    border-radius: 10px; padding: 11px 14px; font-size: 0.9rem; line-height: 1.46;
    border-left: 5px solid #94a3b8; background: #f1f5f9; color: #334155;
  }
  .result.ok { background: #dcfce7; border-left-color: #16a34a; color: #14532d; }
  .result.fail { background: #fee2e2; border-left-color: #dc2626; color: #7f1d1d; }
</style>
</head>
<body>
<header>
  <h1>🔬 Phòng Thí Nghiệm Ảo: Tính Đối Xứng (Toán 6 — SGK KNTT)</h1>
  <div class="tabs">
    <button class="tab-btn active" id="tabFold" onclick="setMode('fold')">📄 Bài 21: Hình có Trục đối xứng (Gấp 3D)</button>
    <button class="tab-btn" id="tabRot" onclick="setMode('rotate')">🎯 Bài 22: Hình có Tâm đối xứng (M – O – M' &amp; Quay 180°)</button>
  </div>
</header>

<main>
  <aside class="panel">
    <div>
      <div class="label" id="lblGeo">Hình học phẳng (Bài 21)</div>
      <div class="shape-list" id="shapeListGeo"></div>
    </div>
    <div>
      <div class="label" id="lblReal">Hình thực tế SGK (Bài 21)</div>
      <div class="shape-list" id="shapeListReal"></div>
    </div>
    <div class="tip" id="tipBox"></div>
  </aside>

  <section class="stage-card">
    <div class="canvas-wrap">
      <canvas id="labCanvas" width="760" height="420"></canvas>
    </div>

    <div class="controls">
      <div class="slider-row">
        <label id="sliderLabel">Góc gấp 3D:</label>
        <input type="range" id="angleSlider" min="0" max="180" value="0" step="1">
        <span class="deg" id="angleDisplay">0°</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnAuto" onclick="toggleAuto()">▶ Gấp tự động 180°</button>
        <button class="btn btn-muted" onclick="resetAngle()">↺ Về 0°</button>
        <button class="btn btn-muted" onclick="resetCenter()">🎯 Đặt lại trục / tâm O</button>
        <label style="display:flex; align-items:center; gap:6px; font-size:0.84rem; font-weight:700; color:#0f766e; cursor:pointer; margin-left:auto;">
          <input type="checkbox" id="chkDiscover" checked onchange="onToggleDiscover()"> 🔍 Chế độ HS tự khám phá
        </label>
      </div>
    </div>

    <div class="result" id="resultBox"></div>
  </section>
</main>

<script>
const canvas = document.getElementById('labCanvas');
const ctx = canvas.getContext('2d');
const CX = canvas.width / 2, CY = canvas.height / 2;

// ============== NẠP ẢNH CHỤP THẬT (NỀN TRONG SUỐT) ==============
const PHOTO_CACHE = {};
function loadRealPhoto(file) {
  const img = new Image();
  img.onload = () => draw();
  img.src = 'real_photos/' + file;
  PHOTO_CACHE[file] = img;
}
['real_butterfly.png', 'real_leaf.png', 'real_snowflake.png', 'real_pinwheel.png', 'real_mandala.png'].forEach(loadRealPhoto);

function makePhotoDrawer(file, size = 290, fallbackFn = null) {
  return function(c) {
    const im = PHOTO_CACHE[file];
    if (im && im.complete && im.naturalWidth > 0) {
      c.drawImage(im, -size / 2, -size / 2, size, size);
    } else if (fallbackFn) fallbackFn(c);
  };
}

// ============== HÌNH VẼ CHUẨN SGK TOÁN 6 KNTT (TRANG 103-107) ==============
function drawPinwheel2SGK(c) {
  // HĐ1 Hình 5.6 tr.103: Chong chóng 2 cánh màu đỏ có viền xanh
  c.save();
  for (const rot of [0, Math.PI]) {
    c.save(); c.rotate(rot);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -132); c.lineTo(52, -132); c.closePath();
    c.fillStyle = '#ef4444'; c.fill();
    c.strokeStyle = '#1d4ed8'; c.lineWidth = 3; c.stroke();
    c.restore();
  }
  c.restore();
}

function drawPinwheel3SGK(c) {
  // HĐ2 Hình 5.7b tr.104: Chong chóng 3 cánh màu đỏ (BẪY SGK: KHÔNG có tâm đối xứng!)
  c.save();
  for (let k = 0; k < 3; k++) {
    c.save(); c.rotate(k * 2 * Math.PI / 3);
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(-18, -55, -22, -125, 25, -128);
    c.bezierCurveTo(68, -126, 62, -62, 22, -32);
    c.quadraticCurveTo(8, -14, 0, 0);
    c.closePath();
    c.fillStyle = '#ef4444'; c.fill(); c.strokeStyle = '#991b1b'; c.lineWidth = 2.5; c.stroke();
    c.restore();
  }
  c.beginPath(); c.arc(0, 0, 14, 0, Math.PI*2); c.fillStyle = '#fde68a'; c.fill(); c.strokeStyle = '#991b1b'; c.lineWidth = 2.5; c.stroke();
  c.restore();
}

function drawClover4SGK(c) {
  // Trang 103 & Bài 5.5a tr.107: Cỏ bốn lá (CÓ tâm đối xứng)
  c.save();
  for (let k = 0; k < 4; k++) {
    c.save(); c.rotate(k * Math.PI / 2 + Math.PI / 4);
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(-48, -32, -56, -112, 0, -118);
    c.bezierCurveTo(56, -112, 48, -32, 0, 0);
    c.closePath();
    c.fillStyle = '#22c55e'; c.fill(); c.strokeStyle = '#15803d'; c.lineWidth = 2.8; c.stroke();
    c.beginPath(); c.moveTo(0, -10); c.lineTo(0, -90); c.strokeStyle = '#bbf7d0'; c.lineWidth = 2; c.stroke();
    c.restore();
  }
  c.restore();
}

function drawNoStoppingSignSGK(c) {
  // Luyện tập 1 - Hình 3a tr.104: Biển cấm dừng và đỗ xe (CÓ tâm đối xứng)
  c.save();
  c.beginPath(); c.arc(0, 0, 126, 0, Math.PI*2);
  c.fillStyle = '#0284c7'; c.fill();
  c.strokeStyle = '#dc2626'; c.lineWidth = 18; c.stroke();
  c.save(); c.beginPath(); c.arc(0, 0, 118, 0, Math.PI*2); c.clip();
  c.strokeStyle = '#dc2626'; c.lineWidth = 18;
  c.beginPath(); c.moveTo(-110, -110); c.lineTo(110, 110); c.stroke();
  c.beginPath(); c.moveTo(110, -110); c.lineTo(-110, 110); c.stroke();
  c.restore();
  c.restore();
}

function drawDangerSignSGK(c) {
  // Luyện tập 1 - Hình 3b tr.104: Biển cảnh báo nguy hiểm (BẪY SGK: KHÔNG có tâm đối xứng!)
  c.save();
  c.beginPath(); c.moveTo(0, -128); c.lineTo(128, 96); c.lineTo(-128, 96); c.closePath();
  c.fillStyle = '#facc15'; c.fill(); c.lineJoin = 'round';
  c.strokeStyle = '#dc2626'; c.lineWidth = 16; c.stroke();
  // Dấu chấm than đen ở giữa
  c.fillStyle = '#0f172a';
  c.fillRect(-10, -54, 20, 74);
  c.beginPath(); c.arc(0, 48, 12, 0, Math.PI*2); c.fill();
  c.restore();
}

function drawStar6SGK(c) {
  // Thử thách nhỏ tr.106: Ngôi sao sáu cánh (CÓ tâm đối xứng)
  c.save();
  for (const rot of [0, Math.PI]) {
    c.save(); c.rotate(rot);
    c.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI/2 + i * 2 * Math.PI / 3;
      const x = 132 * Math.cos(a), y = 132 * Math.sin(a);
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath(); c.strokeStyle = '#0284c7'; c.lineWidth = 12; c.stroke();
    c.restore();
  }
  c.restore();
}

function drawStar5(c) {
  c.save();
  c.beginPath(); c.arc(0, 0, 136, 0, Math.PI*2);
  c.fillStyle = '#dc2626'; c.fill(); c.strokeStyle = '#991b1b'; c.lineWidth = 4; c.stroke();
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 112 : 43;
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    if (i === 0) c.moveTo(r*Math.cos(a), r*Math.sin(a)); else c.lineTo(r*Math.cos(a), r*Math.sin(a));
  }
  c.closePath(); c.fillStyle = '#facc15'; c.fill(); c.strokeStyle = '#ca8a04'; c.lineWidth = 2.5; c.stroke();
  c.restore();
}

function drawLetter(ch, color) {
  return function(c) {
    c.save();
    c.font = '900 230px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = color; c.strokeStyle = '#0f172a'; c.lineWidth = 3.5;
    c.fillText(ch, 0, 12); c.strokeText(ch, 0, 12);
    c.restore();
  };
}

function drawSegmentAB(c) {
  // Đoạn thẳng AB (Ví dụ đầu tiên Bài 22 SGK KNTT: Tâm đối xứng là trung điểm O)
  c.save();
  c.beginPath(); c.moveTo(-150, 0); c.lineTo(150, 0);
  c.strokeStyle = '#1d4ed8'; c.lineWidth = 7; c.lineCap = 'round'; c.stroke();
  [[-150, 'A'], [150, 'B']].forEach(([x, lbl]) => {
    c.beginPath(); c.arc(x, 0, 7, 0, Math.PI*2); c.fillStyle = '#1e3a8a'; c.fill();
    c.fillStyle = '#0f172a'; c.font = 'bold 18px Segoe UI'; c.fillText(lbl, x - 6, -16);
  });
  c.restore();
}

// ============== 2 BỘ HÌNH CHUYÊN BIỆT CHUẨN SGK TOÁN 6 KNTT ==============
const FOLD_SHAPES = [
  { id: 'rect', group: 'geo', name: 'Hình chữ nhật', kind: 'poly', totalAxes: 2, poly: [[-150,-90],[150,-90],[150,90],[-150,90]] },
  { id: 'square', group: 'geo', name: 'Hình vuông', kind: 'poly', totalAxes: 4, poly: [[-110,-110],[110,-110],[110,110],[-110,110]] },
  { id: 'trap', group: 'geo', name: 'Hình thang cân', kind: 'poly', totalAxes: 1, poly: [[-75,-85],[75,-85],[145,85],[-145,85]] },
  { id: 'eqtri', group: 'geo', name: 'Tam giác đều', kind: 'poly', totalAxes: 3, poly: [[0,-130],[112,65],[-112,65]] },
  { id: 'rhom', group: 'geo', name: 'Hình thoi', kind: 'poly', totalAxes: 2, poly: [[0,-120],[150,0],[0,120],[-150,0]] },
  { id: 'para', group: 'geo', name: 'Hình bình hành (Bẫy)', kind: 'poly', totalAxes: 0, poly: [[-100,-80],[160,-80],[100,80],[-160,80]] },
  { id: 'butterfly', group: 'real', name: '🦋 Con bướm (Ảnh thật)', kind: 'art', totalAxes: 1, drawFn: makePhotoDrawer('real_butterfly.png', 295), symAxes: [Math.PI/2] },
  { id: 'leaf', group: 'real', name: '🍁 Lá phong (Ảnh thật)', kind: 'art', totalAxes: 1, drawFn: makePhotoDrawer('real_leaf.png', 285), symAxes: [Math.PI/2] },
  { id: 'snow', group: 'real', name: '❄️ Bông tuyết (Ảnh thật)', kind: 'art', totalAxes: 6, drawFn: makePhotoDrawer('real_snowflake.png', 280), symAxes: [0, Math.PI/6, Math.PI/3, Math.PI/2, 2*Math.PI/3, 5*Math.PI/6] },
  { id: 'star5', group: 'real', name: '⭐ Ngôi sao 5 cánh', kind: 'art', totalAxes: 5, drawFn: drawStar5, symAxes: [0,1,2,3,4].map(k => -Math.PI/2 + k*Math.PI/5) }
];

// Bộ hình Bài 22: Hình có tâm đối xứng (chuẩn 100% SGK Toán 6 KNTT trang 103–107)
const ROTATE_SHAPES = [
  // Hình học phẳng chuẩn SGK (Mục 2 & Luyện tập 1 tr.104-105)
  { id: 'seg', group: 'geo', name: 'Đoạn thẳng AB', kind: 'art', drawFn: drawSegmentAB, hasCenter: true, samplePt: [-150, 0], note: 'Đoạn thẳng AB có tâm đối xứng là trung điểm O (OA = OB).' },
  { id: 'para', group: 'geo', name: 'Hình bình hành', kind: 'poly', poly: [[-100,-80],[160,-80],[100,80],[-160,80]], hasCenter: true, samplePt: [-100, -80], note: 'HĐ3 tr.105: Tâm đối xứng của hình bình hành là giao điểm O của hai đường chéo.' },
  { id: 'rect', group: 'geo', name: 'Hình chữ nhật', kind: 'poly', poly: [[-145,-85],[145,-85],[145,85],[-145,85]], hasCenter: true, samplePt: [-145, -85], note: 'HĐ4 tr.105: Giao điểm O của hai đường chéo là tâm đối xứng.' },
  { id: 'rhom', group: 'geo', name: 'Hình thoi', kind: 'poly', poly: [[0,-118],[150,0],[0,118],[-150,0]], hasCenter: true, samplePt: [0, -118], note: 'HĐ4 tr.105: Giao điểm O của hai đường chéo là tâm đối xứng của hình thoi.' },
  { id: 'hex', group: 'geo', name: 'Lục giác đều', kind: 'poly', poly: Array.from({length:6},(_,i)=>[125*Math.cos(i*Math.PI/3),125*Math.sin(i*Math.PI/3)]), hasCenter: true, samplePt: [125, 0], note: 'HĐ4 tr.105: Giao điểm O của các đường chéo chính là tâm đối xứng.' },
  { id: 'letterN', group: 'geo', name: 'Chữ N (LT1)', kind: 'art', drawFn: drawLetter('N', 'rgba(2,132,199,0.85)'), hasCenter: true, samplePt: [-62, -82], note: 'LT1 tr.104: Chữ H, N, X có tâm đối xứng tại chính giữa.' },
  { id: 'letterM', group: 'geo', name: 'Chữ M (Bẫy LT1)', kind: 'art', drawFn: drawLetter('M', 'rgba(217,119,6,0.85)'), hasCenter: false, samplePt: [-74, -82], note: 'LT1 tr.104: Quay chữ M nửa vòng 180° thành chữ W → Chữ M KHÔNG có tâm đối xứng!' },
  { id: 'eqtri', group: 'geo', name: 'Tam giác đều (Bẫy)', kind: 'poly', poly: [[0,-130],[112,65],[-112,65]], hasCenter: false, samplePt: [0, -130], note: 'Trang 106 SGK: Hình tam giác đều không có tâm đối xứng (quay 180° bị lộn ngược đỉnh)!' },
  // Hình thực tế chuẩn 100% SGK Toán 6 KNTT Bài 22 (tr.103-107)
  { id: 'pw2', group: 'real', name: '🔴 Chong chóng 2 cánh (HĐ1)', kind: 'art', drawFn: drawPinwheel2SGK, hasCenter: true, samplePt: [52, -132], note: 'HĐ1 Hình 5.6 tr.103: Quay đúng nửa vòng 180° quanh điểm ghim O, chong chóng 2 cánh khớp với viền ban đầu!' },
  { id: 'pw3', group: 'real', name: '⚠️ Chong chóng 3 cánh (HĐ2)', kind: 'art', drawFn: drawPinwheel3SGK, hasCenter: false, samplePt: [25, -125], note: 'HĐ2 Hình 5.7b tr.104: Chong chóng 3 cánh quay nửa vòng 180° KHÔNG chồng khít → KHÔNG có tâm đối xứng!' },
  { id: 'pw4', group: 'real', name: '🌀 Chong chóng 4 cánh (HĐ2)', kind: 'art', drawFn: makePhotoDrawer('real_pinwheel.png', 290), hasCenter: true, samplePt: [-95, -95], note: 'HĐ2 Hình 5.7c tr.104: Chong chóng 4 cánh quay nửa vòng 180° chồng khít hoàn toàn → CÓ tâm đối xứng!' },
  { id: 'clover4', group: 'real', name: '🍀 Cỏ bốn lá (SGK tr.103)', kind: 'art', drawFn: drawClover4SGK, hasCenter: true, samplePt: [-82, -82], note: 'Trang 103 & Bài 5.5a tr.107: Cỏ bốn lá vừa có 4 trục đối xứng, vừa có tâm đối xứng tại O!' },
  { id: 'sign_ok', group: 'real', name: '🚫 Biển cấm đỗ (LT1-3a)', kind: 'art', drawFn: drawNoStoppingSignSGK, hasCenter: true, samplePt: [-88, -88], note: 'LT1 Hình 3a tr.104: Biển cấm dừng và đỗ xe có tâm đối xứng tại tâm hình tròn!' },
  { id: 'sign_no', group: 'real', name: '⚠️ Biển cảnh báo (Bẫy 3b)', kind: 'art', drawFn: drawDangerSignSGK, hasCenter: false, samplePt: [0, -122], note: 'LT1 Hình 3b tr.104: Biển cảnh báo tam giác quay 180° bị lộn ngược → KHÔNG có tâm đối xứng!' },
  { id: 'star6', group: 'real', name: '✡️ Sao 6 cánh (SGK tr.106)', kind: 'art', drawFn: drawStar6SGK, hasCenter: true, samplePt: [0, -132], note: 'Thử thách nhỏ tr.106: Ngôi sao sáu cánh có tâm đối xứng tại O!' },
  { id: 'snow_r', group: 'real', name: '❄️ Bông tuyết (SGK tr.106)', kind: 'art', drawFn: makePhotoDrawer('real_snowflake.png', 280), hasCenter: true, samplePt: [0, -120], note: 'Thử thách nhỏ tr.106: Bông tuyết có tâm đối xứng tại chính giữa O!' }
];

let mode = 'fold', shapeId = 'rect', angle = 0, animId = null;
let foldCenter = { x: 0, y: 0 }, foldTheta = 0.54, pivot = { x: 0, y: 0 };
let probeM = { x: -100, y: -80 }; // Điểm kiểm tra M trên viền hình (Tab Đối xứng tâm)
let dragWhat = null;
let foundAxes = [];

function getList() { return mode === 'fold' ? FOLD_SHAPES : ROTATE_SHAPES; }
function getShape() { return getList().find(s => s.id === shapeId) || getList()[0]; }
function isDiscoverMode() { const el = document.getElementById('chkDiscover'); return el ? el.checked : true; }

function initToolPosition() {
  foundAxes = [];
  const sh = getShape();
  if (mode === 'fold') {
    foldCenter = { x: 0, y: 0 };
    foldTheta = isDiscoverMode() ? Math.atan2(90, 150) : Math.PI / 2;
  } else {
    pivot = isDiscoverMode() ? { x: 48, y: -24 } : { x: 0, y: 0 };
    probeM = sh.samplePt ? { x: sh.samplePt[0], y: sh.samplePt[1] } : { x: -100, y: -60 };
  }
}

function getFoldEndpoints() {
  const R = 175;
  return {
    a: { x: foldCenter.x - Math.cos(foldTheta)*R, y: foldCenter.y - Math.sin(foldTheta)*R },
    b: { x: foldCenter.x + Math.cos(foldTheta)*R, y: foldCenter.y + Math.sin(foldTheta)*R }
  };
}

function onToggleDiscover() {
  stopAuto(); angle = 0;
  document.getElementById('angleSlider').value = 0;
  document.getElementById('angleDisplay').textContent = '0°';
  initToolPosition(); updateResult(); draw();
}

function setMode(m) {
  stopAuto();
  mode = m; angle = 0;
  shapeId = getList()[0].id;
  initToolPosition();
  document.getElementById('angleSlider').value = 0;
  document.getElementById('angleDisplay').textContent = '0°';
  document.getElementById('tabFold').classList.toggle('active', m === 'fold');
  document.getElementById('tabRot').classList.toggle('active', m === 'rotate');
  document.getElementById('lblGeo').textContent = m === 'fold' ? 'Hình học phẳng (Bài 21)' : 'Hình học phẳng (Bài 22)';
  document.getElementById('lblReal').textContent = m === 'fold' ? 'Hình thực tế SGK (Bài 21)' : 'Hình thực tế SGK (Bài 22)';
  document.getElementById('sliderLabel').textContent = m === 'fold' ? 'Góc gấp 3D:' : 'Quay nửa vòng 180°:';
  document.getElementById('btnAuto').textContent = m === 'fold' ? '▶ Gấp tự động 180°' : '▶ Quay nửa vòng 180°';
  document.getElementById('tipBox').innerHTML = m === 'fold'
    ? '<b>Cách dùng Bài 21 (Trục ĐX):</b><br>1. Kéo <b>nút cam</b> xoay đường gấp <b>d</b> theo các hướng để tự tìm trục.<br>2. Nhấn <b>Gấp tự động 180°</b> để kiểm chứng &amp; lưu các trục tìm được.'
    : '<b>Cách dùng Bài 22 (Tâm ĐX):</b><br>1. Kéo <b>chấm vàng O</b> đặt tâm đối xứng.<br>2. Kéo <b>điểm xanh M</b> trên hình để quan sát điểm đối xứng <b>M\'</b> qua tâm O (<b>OM = OM\'</b>).<br>3. Nhấn <b>Quay nửa vòng 180°</b> để đối chứng sự chồng khít!';
  renderList(); updateResult(); draw();
}

function renderList() {
  const elGeo = document.getElementById('shapeListGeo');
  const elReal = document.getElementById('shapeListReal');
  elGeo.innerHTML = ''; elReal.innerHTML = '';
  getList().forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (s.id === shapeId ? ' active' : '');
    b.textContent = s.name;
    b.onclick = () => {
      stopAuto(); shapeId = s.id; angle = 0;
      initToolPosition();
      document.getElementById('angleSlider').value = 0;
      document.getElementById('angleDisplay').textContent = '0°';
      renderList(); updateResult(); draw();
    };
    (s.group === 'geo' ? elGeo : elReal).appendChild(b);
  });
}

// === TOÁN HỌC KIỂM CHỨNG ===
function ptSegDist(p, a, b) {
  const vx=b[0]-a[0], vy=b[1]-a[1], l2=vx*vx+vy*vy;
  if (!l2) return Math.hypot(p[0]-a[0], p[1]-a[1]);
  const t = Math.max(0, Math.min(1, ((p[0]-a[0])*vx+(p[1]-a[1])*vy)/l2));
  return Math.hypot(p[0]-(a[0]+t*vx), p[1]-(a[1]+t*vy));
}
function checkPolyMatch(orig, trans) {
  let err = 0;
  for (const p of trans) {
    let m = Infinity;
    for (let i=0;i<orig.length;i++) m = Math.min(m, ptSegDist(p, orig[i], orig[(i+1)%orig.length]));
    err = Math.max(err, m);
  }
  return err < 8;
}
function isCurrentFoldSym() {
  const sh = getShape();
  if (sh.kind === 'poly') {
    const { a: A } = getFoldEndpoints();
    const ux = Math.cos(foldTheta), uy = Math.sin(foldTheta);
    return checkPolyMatch(sh.poly, sh.poly.map(p => { const pr=(p[0]-A.x)*ux+(p[1]-A.y)*uy; return [2*(A.x+pr*ux)-p[0], 2*(A.y+pr*uy)-p[1]]; }));
  }
  const distToOrigin = Math.abs(foldCenter.x * (-Math.sin(foldTheta)) + foldCenter.y * Math.cos(foldTheta));
  if (distToOrigin > 10) return false;
  return sh.symAxes.some(ax => Math.abs(Math.sin(foldTheta - ax)) < 0.06);
}
function isCurrentRotSym() {
  const sh = getShape();
  if (sh.kind === 'poly') return checkPolyMatch(sh.poly, sh.poly.map(([x,y]) => [2*pivot.x-x, 2*pivot.y-y]));
  return sh.hasCenter && Math.hypot(pivot.x, pivot.y) < 12;
}

// === CẮT & GẤP 3D ===
function clipPoly(poly, A, B, keepPos) {
  const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len, s=keepPos?1:-1;
  const d = p => (p[0]-A.x)*nx+(p[1]-A.y)*ny;
  const out = [];
  for (let i=0;i<poly.length;i++) {
    const P=poly[i], Q=poly[(i+1)%poly.length], inP=s*d(P)>=-1e-5, inQ=s*d(Q)>=-1e-5;
    if (inP && inQ) out.push(Q);
    else if (inP && !inQ) { const t=d(P)/(d(P)-d(Q)); out.push([P[0]+t*(Q[0]-P[0]), P[1]+t*(Q[1]-P[1])]); }
    else if (!inP && inQ) { const t=d(P)/(d(P)-d(Q)); out.push([P[0]+t*(Q[0]-P[0]), P[1]+t*(Q[1]-P[1])]); out.push(Q); }
  }
  return out;
}
function foldPt(p, A, B, phi) {
  const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
  const px=p[0]-A.x, py=p[1]-A.y, al=px*ux+py*uy, di=px*nx+py*ny;
  const sc = 1 + (di*Math.sin(phi))/950;
  return [A.x+(al*ux+di*Math.cos(phi)*nx)*sc, A.y+(al*uy+di*Math.cos(phi)*ny)*sc];
}
function drawPoly(pts, fill, stroke, lw=2.5, dash=[]) {
  if (!pts || pts.length<3) return;
  ctx.save(); ctx.beginPath(); ctx.moveTo(CX+pts[0][0], CY+pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(CX+pts[i][0], CY+pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle=fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.setLineDash(dash); ctx.stroke(); }
  ctx.restore();
}

// Vẽ dấu gạch bằng nhau ở giữa đoạn AB (ký hiệu OM = OM' chuẩn SGK Hình học)
function drawEqualTick(x1, y1, x2, y2, col) {
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy/len * 7, ny = dx/len * 7;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(mx - nx, my - ny); ctx.lineTo(mx + nx, my + ny); ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const sh = getShape();

  if (mode === 'fold') {
    const { a: A, b: B } = getFoldEndpoints();
    const ok = isCurrentFoldSym();

    if (sh.kind === 'poly') {
      drawPoly(sh.poly, null, '#94a3b8', 1.8, [6,5]);
      drawPoly(clipPoly(sh.poly, A, B, false), 'rgba(59,130,246,0.38)', '#1d4ed8', 2.5);
      const moved = clipPoly(sh.poly, A, B, true).map(p => foldPt(p, A, B, angle*Math.PI/180));
      const fillM = angle===180 ? (ok ? 'rgba(34,197,94,0.58)' : 'rgba(239,68,68,0.52)') : 'rgba(249,115,22,0.52)';
      const strM = angle===180 ? (ok ? '#15803d' : '#dc2626') : '#c2410c';
      drawPoly(moved, fillM, strM, 2.8);
    } else {
      const phi = angle * Math.PI / 180;
      const cosPhi = Math.cos(phi);
      ctx.save();
      ctx.translate(CX + foldCenter.x, CY + foldCenter.y); ctx.rotate(foldTheta);
      ctx.beginPath(); ctx.rect(-450, -450, 900, 450); ctx.clip();
      ctx.rotate(-foldTheta); ctx.translate(-foldCenter.x, -foldCenter.y);
      sh.drawFn(ctx); ctx.restore();

      ctx.save();
      ctx.translate(CX + foldCenter.x, CY + foldCenter.y); ctx.rotate(foldTheta);
      ctx.scale(1, Math.abs(cosPhi) < 0.02 ? 0.02 : cosPhi);
      ctx.beginPath(); ctx.rect(-450, 0, 900, 450); ctx.clip();
      ctx.rotate(-foldTheta); ctx.translate(-foldCenter.x, -foldCenter.y);
      ctx.globalAlpha = angle > 90 ? 0.72 : 0.96;
      sh.drawFn(ctx); ctx.restore();
    }

    foundAxes.forEach(ax => {
      ctx.save(); ctx.beginPath();
      ctx.moveTo(CX - Math.cos(ax)*165, CY - Math.sin(ax)*165);
      ctx.lineTo(CX + Math.cos(ax)*165, CY + Math.sin(ax)*165);
      ctx.strokeStyle = 'rgba(22, 163, 74, 0.75)'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]); ctx.stroke();
      ctx.restore();
    });

    ctx.save(); ctx.beginPath(); ctx.moveTo(CX+A.x, CY+A.y); ctx.lineTo(CX+B.x, CY+B.y);
    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3.2; ctx.setLineDash([9,6]); ctx.stroke(); ctx.restore();
    [A, B].forEach(pt => {
      ctx.beginPath(); ctx.arc(CX+pt.x, CY+pt.y, 10, 0, Math.PI*2);
      ctx.fillStyle = '#f59e0b'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    });
    ctx.fillStyle = '#92400e'; ctx.font = 'bold 14px Segoe UI';
    ctx.fillText('d (Kéo nút cam xoay trục)', CX+B.x+14, CY+B.y+5);
  } else {
    // ============== MÔ PHỎNG ĐÚNG BẢN CHẤT ĐỐI XỨNG TÂM O (M — O — M' & QUAY NỬA VÒNG 180°) ==============
    const rad = angle * Math.PI / 180;
    const ok = isCurrentRotSym();

    // 1. Hình gốc cố định (nét đứt / bóng mờ làm mốc)
    if (sh.kind === 'poly') {
      drawPoly(sh.poly, 'rgba(148,163,184,0.16)', '#475569', 2.4, [7,5]);
      if (angle > 0) {
        const rot = sh.poly.map(([x,y]) => {
          const rx=x-pivot.x, ry=y-pivot.y;
          return [pivot.x + rx*Math.cos(rad) - ry*Math.sin(rad), pivot.y + rx*Math.sin(rad) + ry*Math.cos(rad)];
        });
        const fillR = angle===180 ? (ok ? 'rgba(34,197,94,0.48)' : 'rgba(239,68,68,0.44)') : 'rgba(37,99,235,0.34)';
        const strR = angle===180 ? (ok ? '#15803d' : '#dc2626') : '#1d4ed8';
        drawPoly(rot, fillR, strR, 2.6);
      } else {
        drawPoly(sh.poly, 'rgba(37,99,235,0.22)', '#1d4ed8', 2.5);
      }
    } else {
      ctx.save(); ctx.translate(CX, CY); ctx.globalAlpha = angle > 0 ? 0.25 : 0.96; sh.drawFn(ctx); ctx.restore();
      if (angle > 0) {
        ctx.save();
        ctx.translate(CX + pivot.x, CY + pivot.y); ctx.rotate(rad); ctx.translate(-pivot.x, -pivot.y);
        ctx.globalAlpha = angle === 180 ? 0.80 : 0.88;
        sh.drawFn(ctx);
        ctx.restore();
      }
    }

    // 2. Vẽ CẶP ĐIỂM ĐỐI XỨNG M — O — M' (với OM = OM') và cung quay 180° từ M sang M'
    const mx = probeM.x, my = probeM.y;
    const m2x = 2 * pivot.x - mx, m2y = 2 * pivot.y - my; // Điểm đối xứng M' qua O
    const rOM = Math.hypot(mx - pivot.x, my - pivot.y);
    const startAng = Math.atan2(my - pivot.y, mx - pivot.x);

    // Đoạn thẳng M — O — M' nét đứt đậm + ký hiệu gạch bằng nhau OM = OM'
    const lineCol = ok ? '#15803d' : '#dc2626';
    ctx.save();
    ctx.beginPath(); ctx.moveTo(CX + mx, CY + my); ctx.lineTo(CX + m2x, CY + m2y);
    ctx.strokeStyle = lineCol; ctx.lineWidth = 2.6; ctx.setLineDash([7, 5]); ctx.stroke();
    ctx.restore();
    drawEqualTick(CX + mx, CY + my, CX + pivot.x, CY + pivot.y, lineCol);
    drawEqualTick(CX + pivot.x, CY + pivot.y, CX + m2x, CY + m2y, lineCol);

    // Cung tròn quỹ đạo quay nửa vòng (0° → angle°) nối từ M sang M'
    if (angle > 0 && rOM > 8) {
      ctx.save();
      ctx.beginPath(); ctx.arc(CX + pivot.x, CY + pivot.y, rOM, startAng, startAng + rad);
      ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2.6; ctx.setLineDash([4, 4]); ctx.stroke();
      ctx.restore();
    }

    // Điểm M (kéo được)
    ctx.beginPath(); ctx.arc(CX + mx, CY + my, 8.5, 0, Math.PI*2);
    ctx.fillStyle = '#2563eb'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.fillStyle = '#1e3a8a'; ctx.font = 'bold 14px Segoe UI';
    ctx.fillText('M (Kéo)', CX + mx + 11, CY + my - 6);

    // Điểm đối xứng M'
    ctx.beginPath(); ctx.arc(CX + m2x, CY + m2y, 8.5, 0, Math.PI*2);
    ctx.fillStyle = ok ? '#16a34a' : '#dc2626'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.fillStyle = ok ? '#14532d' : '#991b1b'; ctx.font = 'bold 14px Segoe UI';
    ctx.fillText("M' (Đối xứng)", CX + m2x + 11, CY + m2y + 16);

    // Tâm O (chấm vàng kéo được)
    ctx.beginPath(); ctx.arc(CX + pivot.x, CY + pivot.y, 9.5, 0, Math.PI*2);
    ctx.fillStyle = '#eab308'; ctx.fill(); ctx.strokeStyle = '#713f12'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 15px Segoe UI';
    ctx.fillText('O', CX + pivot.x + 12, CY + pivot.y - 9);
  }
}

function updateResult() {
  const box = document.getElementById('resultBox');
  const sh = getShape();
  if (mode === 'fold') {
    if (angle < 180) {
      box.className = 'result';
      box.innerHTML = `<b>Góc gấp: ${angle}°</b> — Kéo nút cam xoay đường gấp <b>d</b> theo hướng bạn dự đoán, rồi nhấn <b>Gấp tự động 180°</b> để kiểm chứng.`;
      return;
    }
    const ok = isCurrentFoldSym();
    if (ok && !foundAxes.some(ax => Math.abs(Math.sin(foldTheta - ax)) < 0.08)) foundAxes.push(foldTheta);
    const tot = sh.totalAxes || 0;
    const progress = tot > 0 ? ` — <b>Đã phát hiện: ${foundAxes.length} / ${tot} trục đối xứng</b>` : '';
    box.className = 'result ' + (ok ? 'ok' : 'fail');
    box.innerHTML = ok
      ? `<b>✅ TRÙNG KHÍT 100%!</b> Đường thẳng <b>d</b> là trục đối xứng của ${sh.name}${progress}.${foundAxes.length < tot ? ' Kéo nút cam sang hướng khác để tìm thêm trục!' : ' 🎉 Đã tìm đủ tất cả các trục!'}`
      : `<b>❌ BỊ LỆCH!</b> Hai nửa không chồng khít → Đường thẳng <b>d</b> KHÔNG phải trục đối xứng${progress}.`;
  } else {
    const ok = isCurrentRotSym();
    if (angle < 180) {
      box.className = 'result';
      box.innerHTML = `<b>Quan sát đối xứng tâm qua O (OM = OM'):</b> Kéo <b>tâm O</b> vào vị trí dự đoán và kéo <b>điểm M</b> quanh hình để xem <b>M'</b> có nằm trên hình không, sau đó nhấn <b>Quay nửa vòng 180°</b>!`;
      return;
    }
    box.className = 'result ' + (ok ? 'ok' : 'fail');
    box.innerHTML = ok
      ? `<b>✅ ĐIỂM O LÀ TÂM ĐỐI XỨNG CỦA ${sh.name.toUpperCase()}!</b> ${sh.note}`
      : `<b>❌ KHÔNG PHẢI TÂM ĐỐI XỨNG!</b> ${!sh.hasCenter ? sh.note : 'Tâm O đang bị đặt lệch! Hãy kéo chấm vàng O về chính giữa hình để OM = OM\' và hình chồng khít khi quay 180°.'}`;
  }
}

function getMouse(e) {
  const r = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx-r.left)*(canvas.width/r.width)-CX, y: (cy-r.top)*(canvas.height/r.height)-CY };
}
function snapTheta(th) {
  const targets = [0, Math.PI/2, Math.PI, -Math.PI/2, Math.PI/4, -Math.PI/4, 3*Math.PI/4, -3*Math.PI/4, Math.PI/3, -Math.PI/3, Math.PI/6, -Math.PI/6];
  if (shapeId === 'rect') { const d = Math.atan2(90, 150); targets.push(d, -d, Math.PI-d, -Math.PI+d); }
  if (shapeId === 'star5') { for (let k=0;k<5;k++) { const a=-Math.PI/2+k*Math.PI/5; targets.push(a, a+Math.PI); } }
  for (const t of targets) { if (Math.abs(Math.atan2(Math.sin(th-t), Math.cos(th-t))) < 0.08) return t; }
  return th;
}

canvas.addEventListener('pointerdown', e => {
  stopAuto();
  const m = getMouse(e);
  if (mode === 'fold') {
    const { a: A, b: B } = getFoldEndpoints();
    if (Math.hypot(m.x-A.x, m.y-A.y) < 22) { dragWhat = 'endA'; return; }
    if (Math.hypot(m.x-B.x, m.y-B.y) < 22) { dragWhat = 'endB'; return; }
    if (ptSegDist([m.x,m.y], [A.x,A.y], [B.x,B.y]) < 15) { dragWhat = 'axis'; return; }
  } else {
    if (Math.hypot(m.x-pivot.x, m.y-pivot.y) < 20) { dragWhat = 'pivot'; return; }
    if (Math.hypot(m.x-probeM.x, m.y-probeM.y) < 22) { dragWhat = 'probeM'; return; }
  }
});

canvas.addEventListener('pointermove', e => {
  const m = getMouse(e);
  if (!dragWhat) {
    let grab = false;
    if (mode === 'rotate') grab = Math.hypot(m.x-pivot.x, m.y-pivot.y)<20 || Math.hypot(m.x-probeM.x, m.y-probeM.y)<22;
    canvas.style.cursor = grab ? 'grab' : 'default';
    return;
  }
  canvas.style.cursor = 'grabbing';
  if (dragWhat === 'endA' || dragWhat === 'endB') {
    let th = Math.atan2(m.y - foldCenter.y, m.x - foldCenter.x);
    if (dragWhat === 'endA') th += Math.PI;
    foldTheta = snapTheta(th);
  } else if (dragWhat === 'axis') {
    foldCenter.x = Math.abs(m.x) < 14 ? 0 : Math.max(-180, Math.min(180, m.x));
    foldCenter.y = Math.abs(m.y) < 14 ? 0 : Math.max(-120, Math.min(120, m.y));
  } else if (dragWhat === 'pivot') {
    pivot.x = Math.abs(m.x) < 16 ? 0 : Math.max(-180, Math.min(180, m.x));
    pivot.y = Math.abs(m.y) < 16 ? 0 : Math.max(-120, Math.min(120, m.y));
  } else if (dragWhat === 'probeM') {
    probeM.x = Math.max(-220, Math.min(220, m.x));
    probeM.y = Math.max(-165, Math.min(165, m.y));
  }
  updateResult(); draw();
});
window.addEventListener('pointerup', () => { dragWhat = null; });

document.getElementById('angleSlider').oninput = e => {
  stopAuto(); angle = parseInt(e.target.value, 10);
  document.getElementById('angleDisplay').textContent = angle + '°';
  updateResult(); draw();
};
function toggleAuto() {
  if (animId) { stopAuto(); return; }
  if (angle >= 180) angle = 0;
  document.getElementById('btnAuto').textContent = '⏸ Tạm dừng';
  function step() {
    angle += 2.5;
    if (angle >= 180) {
      angle = 180; document.getElementById('angleSlider').value = 180;
      document.getElementById('angleDisplay').textContent = '180°';
      updateResult(); draw(); stopAuto(); return;
    }
    document.getElementById('angleSlider').value = Math.round(angle);
    document.getElementById('angleDisplay').textContent = Math.round(angle) + '°';
    updateResult(); draw(); animId = requestAnimationFrame(step);
  }
  animId = requestAnimationFrame(step);
}
function stopAuto() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  document.getElementById('btnAuto').textContent = mode === 'fold' ? '▶ Gấp tự động 180°' : '▶ Quay nửa vòng 180°';
}
function resetAngle() { stopAuto(); angle = 0; document.getElementById('angleSlider').value = 0; document.getElementById('angleDisplay').textContent = '0°'; updateResult(); draw(); }
function resetCenter() { stopAuto(); initToolPosition(); angle = 0; document.getElementById('angleSlider').value = 0; document.getElementById('angleDisplay').textContent = '0°'; updateResult(); draw(); }

setMode('fold');
</script>
</body>
