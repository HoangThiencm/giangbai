function compactContext(text, maxLen) {
    const raw = String(text || '').replace(/\s+/g, ' ').trim();
    const limit = maxLen || 12000;
    const needle = String(state.meta.baiHoc || '').toLowerCase();
    if (needle && raw.toLowerCase().includes(needle)) {
        const i = raw.toLowerCase().indexOf(needle);
        return raw.slice(Math.max(0, i - 400), i + Math.min(limit, 9000));
    }
    return raw.slice(0, limit);
}

function persistLocal() {
    try {
        const slim = JSON.parse(JSON.stringify(state));
        slim.evidence = (slim.evidence || []).map(e => ({ ...e, dataUrl: e.dataUrl ? '[local-image]' : '' }));
        localStorage.setItem(NCBH_LS_KEY, JSON.stringify({ id: currentSessionId, state: slim, savedAt: Date.now() }));
        const st = document.getElementById('saveStatus');
        if (st) st.textContent = 'Đã lưu cục bộ ' + nowLabel();
    } catch (e) { console.warn('localStorage autosave skipped', e.message); }
}

function restoreLocal() {
    try {
        const raw = localStorage.getItem(NCBH_LS_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed?.state) {
            state = Object.assign(emptyState(), parsed.state);
            currentSessionId = parsed.id || null;
        }
    } catch (e) { /* ignore corrupt draft */ }
}

async function syncUserKeysFromServer() {
    geminiModel = currentGeminiModel();
    try {
        const r = await fetch('api/user_gemini_keys.php', { credentials: 'include', cache: 'no-store' });
        const d = await r.json();
        geminiKeys = Array.isArray(d.keys) ? d.keys.filter(Boolean) : [];
        mistralKeys = Array.isArray(d.mistral_keys) ? d.mistral_keys.filter(Boolean) : [];
        if (geminiKeys.length) localStorage.setItem('global_gemini_keys', JSON.stringify(geminiKeys));
        if (mistralKeys.length) localStorage.setItem('global_mistral_keys', JSON.stringify(mistralKeys));
        document.getElementById('keyStatus').textContent = `🔑 Đã nạp ${geminiKeys.length} Gemini API Key và ${mistralKeys.length} Mistral Key từ CSDL · model ${geminiModel}.`;
    } catch (e) {
        try { geminiKeys = JSON.parse(localStorage.getItem('global_gemini_keys') || '[]'); } catch { geminiKeys = []; }
        try { mistralKeys = JSON.parse(localStorage.getItem('global_mistral_keys') || '[]'); } catch { mistralKeys = []; }
        document.getElementById('keyStatus').textContent = geminiKeys.length || mistralKeys.length
            ? `🔑 Đang dùng ${geminiKeys.length} Gemini / ${mistralKeys.length} Mistral Key đã lưu tạm · model ${geminiModel}.`
            : 'Không thể đồng bộ API Key. Hãy cấu hình Gemini & Mistral trên trang chủ.';
    }
}

function parseAiJson(text) {
    const raw = String(text || '').replace(/^```json\s*|\s*```$/g, '').trim();
    try { return JSON.parse(raw); } catch { return { text: raw }; }
}

async function callGemini(prompt, jsonMode) {
    const model = currentGeminiModel();
    const keys = geminiKeys.slice();
    let lastError = 'Gemini không phản hồi.';
    const tryModels = [model];
    if (model !== DEFAULT_GEMINI_MODEL) tryModels.push(DEFAULT_GEMINI_MODEL);
    for (const mdl of tryModels) {
        for (let i = 0; i < keys.length; i++) {
            const key = keys[i];
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 45000);
            try {
                const body = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.25 } };
                if (jsonMode) body.generationConfig.responseMimeType = 'application/json';
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent?key=${encodeURIComponent(key)}`, {
                    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: controller.signal
                });
                clearTimeout(timer);
                if (res.status === 429 || res.status === 503) { lastError = 'Gemini HTTP ' + res.status; continue; }
                if (!res.ok) { lastError = 'Gemini HTTP ' + res.status; if (res.status >= 500) continue; throw new Error(lastError); }
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            } catch (err) {
                clearTimeout(timer);
                lastError = err.name === 'AbortError' ? 'Timeout 45s khi gọi Gemini.' : (err.message || lastError);
            }
        }
    }
    return callMistral(prompt, lastError);
}

async function callMistral(prompt, previousError) {
    if (!mistralKeys.length) throw new Error(previousError || 'Hết Gemini key và chưa có Mistral Key.');
    let lastError = previousError || 'Mistral không phản hồi.';
    for (const key of mistralKeys) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 45000);
        try {
            const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
                method: 'POST',
                headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key },
                body: JSON.stringify({ model: 'mistral-small-latest', messages: [{ role: 'user', content: prompt }], temperature: 0.25 }),
                signal: controller.signal
            });
            clearTimeout(timer);
            if (res.status === 429 || res.status === 503) { lastError = 'Mistral HTTP ' + res.status; continue; }
            if (!res.ok) { lastError = 'Mistral HTTP ' + res.status; continue; }
            const data = await res.json();
            return data.choices?.[0]?.message?.content || '';
        } catch (err) {
            clearTimeout(timer);
            lastError = err.name === 'AbortError' ? 'Timeout khi gọi Mistral.' : (err.message || lastError);
        }
    }
    throw new Error(lastError);
}

async function runAiTask(taskName, instruction, jsonMode) {
    try {
        const ctx = lessonContext();
        const prompt = `${PRINCIPLES}\nTác vụ AI: ${taskName}.\n${instruction}\n\nNgữ cảnh hồ sơ:\n${ctx}\nNếu thiếu dữ liệu, hãy nói rõ phần nào là yêu cầu văn bản, khuyến nghị chuyên môn, hay đề xuất AI. Không bịa minh chứng.`;
        setAiStatus(taskName + ' đang chạy…');
        const text = await callGemini(prompt, jsonMode);
        setAiStatus(taskName + ' hoàn tất. AI chỉ đề xuất — GV quyết định.');
        return jsonMode ? parseAiJson(text) : text;
    } catch (err) {
        const msg = err.message || String(err);
        setAiStatus('Lỗi ' + taskName + ': ' + msg);
        alert('Không chạy được ' + taskName + ': ' + msg);
        return jsonMode ? { text: msg } : msg;
    }
}

async function extractFileText(file) {
    if (!file) return '';
    if (/pdf$/i.test(file.name)) {
        try {
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            let text = '';
            const lesson = String(state.meta.baiHoc || '').toLowerCase();
            for (let i = 1; i <= pdf.numPages; i++) {
                const pageText = (await (await pdf.getPage(i)).getTextContent()).items.map(x => x.str).join(' ');
                if (!lesson || pageText.toLowerCase().includes(lesson) || pdf.numPages <= 8) text += pageText + '\n';
                else if (text.length < 500) text += pageText + '\n';
            }
            if (text.replace(/\s/g, '').length > 180) return compactContext(text, 16000);
        } catch (e) { console.warn('pdf.js extract failed', e.message); }
        if (window.MistralOcr && mistralKeys.length) {
            const ocr = await MistralOcr.ocrPdfFile(file, mistralKeys, null, { module: 'nghiencuubaihoc' });
            return compactContext((ocr.pages || []).map(p => p.ocr_text).join('\n'), 16000);
        }
        return '';
    }
    if (/docx$/i.test(file.name)) return compactContext((await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value, 16000);
    return compactContext(await file.text(), 12000);
}

async function saveSession(silent) {
    persistLocal();
    try {
        const r = await fetch(API_URL, { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload()) });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'Lưu thất bại');
        currentSessionId = d.session.id;
        persistLocal();
        const st = document.getElementById('saveStatus');
        if (st) st.textContent = 'Đã lưu CSDL #' + currentSessionId + ' · ' + nowLabel();
        if (!silent) alert('Đã lưu hồ sơ NCBH lên CSDL.');
    } catch (e) {
        const st = document.getElementById('saveStatus');
        if (st) st.textContent = 'Lưu CSDL lỗi, vẫn còn bản cục bộ. ' + e.message;
        if (!silent) alert('Không lưu được CSDL: ' + e.message + '. Dữ liệu vẫn nằm trong localStorage.');
    }
}

async function loadSessions() {
    const d = await (await fetch(API_URL + '?action=list', { credentials: 'include' })).json();
    const sessions = d.sessions || [];
    document.getElementById('history').innerHTML = sessions.length
        ? sessions.map(s => `<article class="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white p-3 text-sm"><div><b>${esc(s.session_title || s.bai_hoc || 'Hồ sơ NCBH')}</b><span class="ml-2 text-slate-500">${esc(s.mon_hoc || '')} · Lớp ${esc(s.lop || '')} · Bước ${esc(s.current_step || 1)}</span></div><div class="flex gap-2"><button type="button" onclick="loadSessionById(${s.id})" class="rounded border px-2 py-1 font-bold">Mở</button><button type="button" onclick="deleteSession(${s.id})" class="rounded border border-rose-200 px-2 py-1 font-bold text-rose-700">Xóa</button></div></article>`).join('')
        : '<p class="text-sm text-slate-500">Chưa có hồ sơ đã lưu.</p>';
}

async function loadSessionById(id) {
    const response = await fetch(`${API_URL}?id=${encodeURIComponent(id)}`, { credentials: 'include', cache: 'no-store' });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Không thể tải hồ sơ.');
    const session = data.session || {};
    state = Object.assign(emptyState(), session.session_data || {});
    currentSessionId = Number(session.id);
    persistLocal();
    goStep(Number(session.current_step || state.currentStep || 1));
    alert('Đã tải lại toàn bộ tiến trình hồ sơ.');
}

async function deleteSession(id) {
    await fetch(API_URL + '?action=delete', { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) });
    if (currentSessionId === id) currentSessionId = null;
    loadSessions();
}

function compressImage(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            const c = document.createElement('canvas');
            const scale = Math.min(1, 900 / Math.max(img.width, img.height));
            c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = url;
    });
}

function captureStepFields() {
    if (document.getElementById('fRQ')) state.researchQuestion = val('fRQ');
    document.querySelectorAll('[data-pred]').forEach(el => {

        if (state.studentPredictions[i]) state.studentPredictions[i][k] = el.value;
    });
    document.querySelectorAll('[data-khbd]').forEach(el => {
        const key = el.getAttribute('data-khbd'); const i = Number(el.getAttribute('data-i'));
        const layer = el.getAttribute('data-layer'); const k = el.getAttribute('data-k');
        if (state[key]?.[i]?.[layer]) state[key][i][layer][k] = el.value;
    });
    if (document.getElementById('obsHs')) {
        state.observation = { hsSheet: val('obsHs'), duGio: val('obsDg'), criteria: val('obsTc'), assignment: val('obsPc'), meeting: val('obsHop'), minutes: val('obsBb') };
    }
    if (document.getElementById('discIn')) state.discussionInput = val('discIn');
    document.querySelectorAll('[data-rev]').forEach(el => {
        const i = Number(el.getAttribute('data-rev')); const k = el.getAttribute('data-k');
        if (!state.revisions[i]) state.revisions[i] = { truoc: '', vanDe: '', minhChung: '', deXuat: '', lyDo: '' };
        state.revisions[i][k] = el.value;
    });

function formatKhbd(rows) {
    return (rows || []).map(a => {
        return `${a.name} [${a.decision}]\nLớp 1 (KHBD chính thức): ${JSON.stringify(a.layer1)}\nLớp 2 (Thông tin NCBH): ${JSON.stringify(a.layer2)}`;
    }).join('\n\n');
}

async function buildDoc(title, body) {
    if (!window.docx) throw new Error('Chưa tải thư viện DOCX.');
    const { Document, Packer, Paragraph, HeadingLevel } = docx;
    const lines = String(body || '').split('\n');
    const doc = new Document({
        sections: [{ children: [new Paragraph({ text: title, heading: HeadingLevel.HEADING_1 }), new Paragraph(`Trường / Tổ NCBH — ${state.meta.monHoc} lớp ${state.meta.lop} — ${state.meta.baiHoc}`), new Paragraph('Căn cứ: CV 5512, TT 32/2018, Hướng dẫn NCBH, QĐ 2422, CV 3456 & 2345, TT 38/2021, TT 14/2020.'), ...lines.map(t => new Paragraph(t))] }]
    });
    return Packer.toBlob(doc);
}

async function exportOneDocx(i) {
    const p = PRODUCTS_13[i];
    saveAs(await buildDoc(p.title, productText(p)), slug(p.title) + '.docx');
}

async function exportAllDocx() {
    const body = PRODUCTS_13.map(p => '\n\n===== ' + p.title + ' =====\n' + productText(p)).join('\n');
    saveAs(await buildDoc('Hồ sơ Nghiên cứu bài học — trọn bộ 13 sản phẩm', body), 'Ho-so-NCBH-tron-bo.docx');
}

async function exportZip() {
    if (!window.JSZip) return alert('Chưa tải JSZip.');
    const zip = new JSZip();
    for (const p of PRODUCTS_13) {
        const blob = await buildDoc(p.title, productText(p));
        zip.file(slug(p.title) + '.docx', blob);
    }
    saveAs(await zip.generateAsync({ type: 'blob' }), 'Ho-so-NCBH-13-san-pham.zip');
}

function slug(s) { return String(s || 'ncbh').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-'); }
